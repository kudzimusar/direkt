name: UIA current-main final closeout publisher

on:
  pull_request:
    paths:
      - ".github/workflows/uia-current-main-final-closeout-reconcile.yml"
      - "scripts/uia/publish-current-main-final-closeout.py"

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/uia-current-main-final-closeout'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/uia-current-main-final-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Publish verified non-workflow closeout files
        run: |
          set -euo pipefail
          if [[ ! -f scripts/uia/publish-current-main-final-closeout.py ]]; then
            echo "UIA non-workflow closeout already published"
            exit 0
          fi
          python3 scripts/uia/publish-current-main-final-closeout.py
          python3 scripts/uia/verify-current-main-owner-review.py
          rm scripts/uia/publish-current-main-final-closeout.py
          rm scripts/uia/publish-current-main-refresh-closeout.py
          rm -f .github/workflows/uia-current-main-owner-review-contract.yml
          git checkout -- .github/workflows/uia-current-main-refresh-closeout-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add WORKSTREAM_LOCK.md PROJECT_STATUS.md docs/design/UIA_CURRENT_MAIN_OWNER_REVIEW_RECEIPT.md scripts/uia/verify-current-main-owner-review.py scripts/phase11/verify-wave0-finishing-line.py scripts/uia/publish-current-main-final-closeout.py scripts/uia/publish-current-main-refresh-closeout.py
          git diff --cached --check
          git commit -m 'docs(uia): close current-main owner review'
          git push origin HEAD:docs/uia-current-main-final-closeout