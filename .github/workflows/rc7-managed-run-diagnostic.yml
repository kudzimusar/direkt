name: DIREKT RC7 managed-run diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/rc7-managed-run-diagnostic.yml"

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  diagnostic:
    name: Inspect latest RC7 main-branch managed run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Read startup failure and validate checked-in workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GOBIN: ${{ runner.temp }}/actionlint-bin
        run: |
          set -euo pipefail
          runs_json="${RUNNER_TEMP}/rc7-runs.json"
          run_json="${RUNNER_TEMP}/rc7-run.json"
          jobs_json="${RUNNER_TEMP}/rc7-jobs.json"
          checks_json="${RUNNER_TEMP}/rc7-check-runs.json"
          check_suite_json="${RUNNER_TEMP}/rc7-check-suite.json"
          workflow_json="${RUNNER_TEMP}/rc7-workflow.json"
          actionlint_jsonl="${RUNNER_TEMP}/rc7-actionlint.jsonl"
          actionlint_meta="${RUNNER_TEMP}/rc7-actionlint-meta.json"
          startup_lines="${RUNNER_TEMP}/rc7-startup-lines.txt"
          receipt="${RUNNER_TEMP}/rc7-managed-run-diagnostic.json"

          mkdir -p "${GOBIN}"
          set +e
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            >"${RUNNER_TEMP}/actionlint-install.out" \
            2>"${RUNNER_TEMP}/actionlint-install.err"
          install_code=$?
          actionlint_code=127
          if [[ ${install_code} -eq 0 ]]; then
            "${GOBIN}/actionlint" -format '{{json .}}' \
              .github/workflows/rc7-maps-managed.yml \
              >"${actionlint_jsonl}" \
              2>"${RUNNER_TEMP}/actionlint.err"
            actionlint_code=$?
          else
            : >"${actionlint_jsonl}"
          fi
          set -e
          jq -n \
            --argjson installCode "${install_code}" \
            --argjson actionlintCode "${actionlint_code}" \
            '{tool: "actionlint", version: "v1.7.7", installCode: $installCode, exitCode: $actionlintCode}' \
            > "${actionlint_meta}"

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/rc7-maps-managed.yml/runs?branch=main&event=push&per_page=100" \
            > "${runs_json}"

          latest="$({
            jq -cs '
              [.[].workflow_runs[]]
              | map(select(.event == "push" and .head_branch == "main"))
              | sort_by(.created_at)
              | last
            ' "${runs_json}"
          })"

          if [[ -z "${latest}" || "${latest}" == "null" ]]; then
            echo "No main-branch push run exists for rc7-maps-managed.yml." >&2
            exit 1
          fi

          run_id="$(jq -r '.id' <<< "${latest}")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "${run_json}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" \
            > "${jobs_json}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/rc7-maps-managed.yml" \
            > "${workflow_json}"

          check_suite_id="$(jq -r '.check_suite_id // empty' "${run_json}")"
          if [[ -n "${check_suite_id}" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/check-suites/${check_suite_id}" \
              > "${check_suite_json}"
            gh api "repos/${GITHUB_REPOSITORY}/check-suites/${check_suite_id}/check-runs?per_page=100" \
              > "${checks_json}"
          else
            printf '{}' > "${check_suite_json}"
            printf '{"check_runs":[]}' > "${checks_json}"
          fi

          logs_state="unavailable"
          mkdir -p "${RUNNER_TEMP}/rc7-startup-logs"
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/logs" \
            > "${RUNNER_TEMP}/rc7-startup-logs.zip" \
            2> "${RUNNER_TEMP}/rc7-startup-logs.err"
          logs_code=$?
          set -e
          if [[ ${logs_code} -eq 0 ]] && unzip -tq "${RUNNER_TEMP}/rc7-startup-logs.zip" >/dev/null 2>&1; then
            logs_state="available"
            unzip -q "${RUNNER_TEMP}/rc7-startup-logs.zip" -d "${RUNNER_TEMP}/rc7-startup-logs"
            grep -R -E -i \
              'invalid workflow|workflow is not valid|error|unrecognized|unexpected|not allowed|mapping|expression' \
              "${RUNNER_TEMP}/rc7-startup-logs" \
              | head -n 20 \
              | sed -E 's/[A-Za-z0-9_+=\/.:-]{40,}/[REDACTED]/g' \
              > "${startup_lines}" || true
          else
            printf 'logs_api_exit=%s\n' "${logs_code}" > "${startup_lines}"
          fi

          jq -n \
            --slurpfile run "${run_json}" \
            --slurpfile jobs "${jobs_json}" \
            --slurpfile checks "${checks_json}" \
            --slurpfile checkSuite "${check_suite_json}" \
            --slurpfile workflow "${workflow_json}" \
            --slurpfile actionlintMeta "${actionlint_meta}" \
            --rawfile actionlint "${actionlint_jsonl}" \
            --arg logsState "${logs_state}" \
            --rawfile startupLines "${startup_lines}" \
            '{
              schema: "direkt.rc7.managed-run-diagnostic.v3",
              readOnly: true,
              gcpAccess: false,
              secretValuesAccessed: false,
              resourceMutation: false,
              workflow: {
                id: $workflow[0].id,
                name: $workflow[0].name,
                path: $workflow[0].path,
                state: $workflow[0].state
              },
              run: {
                id: $run[0].id,
                name: $run[0].name,
                displayTitle: $run[0].display_title,
                runNumber: $run[0].run_number,
                runAttempt: $run[0].run_attempt,
                status: $run[0].status,
                conclusion: $run[0].conclusion,
                event: $run[0].event,
                headBranch: $run[0].head_branch,
                headSha: $run[0].head_sha,
                runStartedAt: $run[0].run_started_at,
                createdAt: $run[0].created_at,
                updatedAt: $run[0].updated_at,
                actor: $run[0].actor.login,
                triggeringActor: $run[0].triggering_actor.login,
                checkSuiteId: $run[0].check_suite_id,
                htmlUrl: $run[0].html_url
              },
              checkSuite: {
                status: $checkSuite[0].status,
                conclusion: $checkSuite[0].conclusion,
                latestCheckRunsCount: $checkSuite[0].latest_check_runs_count
              },
              jobs: ($jobs[0].jobs | map({
                id,
                name,
                status,
                conclusion,
                startedAt: .started_at,
                completedAt: .completed_at,
                steps: (.steps | map({name, number, status, conclusion}))
              })),
              checkRuns: ($checks[0].check_runs | map({
                id,
                name,
                status,
                conclusion,
                detailsUrl: .details_url,
                output: {title: .output.title, summary: .output.summary}
              })),
              validator: ($actionlintMeta[0] + {
                findings: ($actionlint | split("\n") | map(select(length > 0)) | map(fromjson))
              }),
              startupLogs: {
                state: $logsState,
                diagnosticLines: ($startupLines | split("\n") | map(select(length > 0)))
              }
            }' > "${receipt}"

          {
            echo '### RC7 latest managed-run diagnostic'
            echo
            echo '```json'
            cat "${receipt}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload read-only diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: rc7-managed-run-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/rc7-managed-run-diagnostic.json
          if-no-files-found: error
          retention-days: 1
