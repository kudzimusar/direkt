name: DIREKT RC7 format backend once

on:
  push:
    branches:
      - integration/runtime-closure-261
    paths:
      - ".github/workflows/rc7-format-backend-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/runtime-closure-261
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/direkt-api/package-lock.json
      - name: Format backend source and tests
        working-directory: backend/direkt-api
        run: |
          npm ci --ignore-scripts
          npm run format
      - name: Commit formatted source and remove bridge
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rc7-format-backend-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(rc7): format Maps backend source"
          git push origin HEAD:integration/runtime-closure-261
