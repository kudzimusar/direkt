name: RC7 exact Prettier diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/rc7-format-diagnostic.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/rc7-service-identity-oauth'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/direkt-api
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/direkt-api/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Publish exact formatting result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          output="$(npm run format:check 2>&1)"
          status=$?
          set -e
          body="${RUNNER_TEMP}/rc7-format-diagnostic.md"
          {
            echo '## RC7 exact Prettier diagnostic'
            echo
            echo "Exit status: \`${status}\`"
            echo
            echo '```text'
            printf '%s\n' "${output}"
            echo '```'
          } > "${body}"
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file "${body}"
