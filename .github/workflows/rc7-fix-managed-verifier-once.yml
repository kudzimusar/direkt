name: DIREKT RC7 fix managed verifier once

on:
  push:
    branches:
      - integration/runtime-closure-261
    paths:
      - "scripts/rc7/fix-managed-verifier-once.py"
      - ".github/workflows/rc7-fix-managed-verifier-once.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/runtime-closure-261
          fetch-depth: 0
      - run: python3 scripts/rc7/fix-managed-verifier-once.py
      - run: python3 scripts/rc7/verify-maps-contract.py
      - name: Commit correction and remove bridge
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/rc7/fix-managed-verifier-once.py
          rm .github/workflows/rc7-fix-managed-verifier-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(rc7): align managed main verifier"
          git push origin HEAD:integration/runtime-closure-261
