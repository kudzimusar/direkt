name: RC7 exact-main run locator

on:
  pull_request:
    paths:
      - ".github/workflows/rc7-main-run-locator.yml"

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  locate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/rc7-main-run-locator'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: 1c6acd7972caca838f27b4e5c4a521c92cbfc7c4
      TARGET_RUN: "30210742617"
      TARGET_JOB: "89816438103"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Locate exact-main RC7 workflow run
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=100")"
          matches="$(jq -c '[.workflow_runs[] | select(.name == "DIREKT RC7 managed Google Maps proof") | {id, run_number, run_attempt, status, conclusion, html_url, head_sha, event, created_at, updated_at}]' <<<"${response}")"
          count="$(jq 'length' <<<"${matches}")"
          body="${RUNNER_TEMP}/rc7-main-run-locator.md"
          {
            echo '## RC7 exact-main workflow locator'
            echo
            echo "- Exact main: \`${TARGET_SHA}\`"
            echo "- Matching push runs: \`${count}\`"
            echo
            echo '```json'
            jq . <<<"${matches}"
            echo '```'
          } >"${body}"
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${GITHUB_REPOSITORY}" --body-file "${body}"

      - name: Publish sanitized failure context
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/rc7-managed-job.log"
          gh run view "${TARGET_RUN}" --repo "${GITHUB_REPOSITORY}" --job "${TARGET_JOB}" --log >"${raw}"
          diagnostic="${RUNNER_TEMP}/rc7-managed-diagnostic.txt"
          python3 - "${raw}" "${diagnostic}" <<'PY'
          from pathlib import Path
          import re
          import sys

          raw_path, output_path = map(Path, sys.argv[1:])
          lines = raw_path.read_text(encoding="utf-8", errors="replace").splitlines()
          pattern = re.compile(r"billing budgets|billing projects|budget|PERMISSION|permission|ERROR|Error|FAILED|RC7|Process completed", re.I)
          selected: set[int] = set()
          for index, line in enumerate(lines):
              if pattern.search(line):
                  selected.update(range(max(0, index - 2), min(len(lines), index + 3)))
          rendered = []
          for index in sorted(selected):
              text = lines[index]
              text = re.sub(r"ya29\.[0-9A-Za-z._-]{20,}", "[REDACTED_OAUTH_TOKEN]", text)
              text = re.sub(r"(?i)(Bearer|Authorization:)\s+\S+", r"\1 [REDACTED]", text)
              text = re.sub(r"[0-9A-Za-z_+=/.:-]{120,}", "[REDACTED_LONG_VALUE]", text)
              rendered.append(text[:1200])
          output_path.write_text("\n".join(rendered[-160:]) + "\n", encoding="utf-8")
          PY
          body="${RUNNER_TEMP}/rc7-managed-diagnostic.md"
          {
            echo '## RC7 managed failure diagnostic'
            echo
            echo "- Run/job: \`${TARGET_RUN}/${TARGET_JOB}\`"
            echo '- Sanitized matching context only; no credential values.'
            echo
            echo '```text'
            cat "${diagnostic}"
            echo '```'
          } >"${body}"
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${GITHUB_REPOSITORY}" --body-file "${body}"
