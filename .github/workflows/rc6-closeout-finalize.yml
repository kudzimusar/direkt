name: DIREKT temporary RC6 closeout finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rc6-closeout-finalize.yml

permissions:
  contents: write

concurrency:
  group: direkt-rc6-closeout-finalize
  cancel-in-progress: false

jobs:
  finalize:
    name: Reconcile RC6 closure and resume RC5
    if: >-
      github.repository == 'kudzimusar/direkt' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/rc6-close-rc5-resume-8838b7a'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify exact closeout branch head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "${EXPECTED_BRANCH}" = "integration/rc6-close-rc5-resume-8838b7a"
          remote_head="$(git ls-remote origin "refs/heads/${EXPECTED_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${EXPECTED_HEAD}"

      - name: Apply exact RC6 closure and RC5-resume reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old[:120]}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          lock = 'WORKSTREAM_LOCK.md'
          replace_once(lock,
              '| Status | CLAIMED — RC6 WhatsApp Cloud API; RC5 and UIA parked by explicit owner sequencing override |',
              '| Status | CLAIMED — RC5 Firebase Test Lab device-matrix closure |')
          replace_once(lock,
              '| Owner/agent | Active repository agent — Issue #261 runtime integration closure, RC6 WhatsApp Cloud API checkpoint. |',
              '| Owner/agent | Active repository agent — Issue #261 runtime integration closure, resumed RC5 Firebase Test Lab checkpoint. |')
          replace_once(lock,
              '| Authorized scope | RC6 only: implement the application-managed WhatsApp Cloud API backend adapter through the transactional outbox, consent-at-send and opt-out enforcement, approved-template controls, signed webhook verification, durable idempotency/retry/delivery-receipt state, privacy-safe payload rules, fail-closed configuration/kill switch, and a synthetic managed canary only where provider state permits. No RC5 Test Lab proof-bridge merge, Maps, payments, generated-client migration, Turnstile, production auth, real-participant activation or production release is authorized in this lane. |',
              '| Authorized scope | RC5 only: complete final owner-side read-only verification of the existing least-privilege Test Lab resources, execute the exact-current-main managed Firebase Test Lab matrix through the preserved proof bridge, retain sanitized artifacts/results, reconcile the permanent verifier/status ledger and close RC5 only on machine-enforced success. No UIA source changes, RC6 changes, Maps, payments, generated-client migration, Turnstile, production auth, real-participant activation or production release is authorized in this lane. |')
          replace_once(lock,
              '| Protected surface | RC5 Firebase Test Lab source/workflows and draft proof bridge PR #378; UIA browser/Android/operations owner-review surfaces and Issue #354; backend/database/OpenAPI trust and authorization boundaries; private API/BFF IAM; operations authorization/private evidence controls; payments; VC1–VC8 Design DNA; Phase 11/12 gates; Android auth/signing/Play/Data Safety; RC0–RC4 closure evidence. |',
              '| Protected surface | Closed RC6 WhatsApp source/workflows and managed evidence run `30137700769`; UIA browser/Android/operations owner-review surfaces and Issue #354; backend/database/OpenAPI trust and authorization boundaries; private API/BFF IAM; operations authorization/private evidence controls; payments; VC1–VC8 Design DNA; Phase 11/12 gates; Android auth/signing/Play/Data Safety; RC0–RC4 closure evidence. |')
          replace_once(lock,
              '| Implementation branch | `integration/rc6-whatsapp-sequencing-fed6db8` from exact current `main@fed6db8ab7c479b5e47095b4f0a752514122a4f6`. |',
              '| Implementation branch | `integration/rc6-close-rc5-resume-8838b7a` from exact current `main@8838b7a6d726a5aed44ce21a39506c1265a98d15`. |')
          replace_once(lock,
              '| Stable baseline | UIA promotion PR #385 is merged at `fed6db8ab7c479b5e47095b4f0a752514122a4f6`. RC5 source PR #377, IAM correction PR #379 and the owner-created least-privilege custom roles/results bucket are preserved, but RC5 remains `IMPLEMENTED_GATED / MANAGED MATRIX PENDING`: final owner-side read-only verification and exact-current-main managed Test Lab proof are not complete because Google Cloud Shell is temporarily quota-blocked. Draft PR #378 remains parked. UIA Issue #354 remains open for remaining owner-access acceptance evidence and is parked/read-only during RC6. RC4 remains closed with managed FCM proof run `29916381754` successful. |',
              '| Stable baseline | RC6 source and managed-proof bridge PR #403 are merged at `8838b7a6d726a5aed44ce21a39506c1265a98d15`; exact-source managed run `30137700769` succeeded on retry through transactional outbox → Meta test-template send → authentic signed webhook receipt. Initial transient Google Cloud CLI setup failure remains preserved in Issue #404. Participant/production WhatsApp delivery remains disabled. RC5 source PR #377, IAM correction PR #379, owner-created least-privilege custom roles/results bucket and draft proof bridge PR #378 remain preserved; RC5 is resumed but not closed pending final owner-side verification and exact-current-main managed matrix proof. UIA Issue #354 remains parked/open. |')
          replace_once(lock,
              '| Current task | RC6 — close the WhatsApp Cloud API application adapter at a fail-closed synthetic/runtime boundary without activating real participant or production delivery. |',
              '| Current task | RC5 — complete the preserved Firebase Test Lab owner verification and exact-current-main managed device-matrix proof without activating participant or production paths. |')
          replace_once(lock,
              '| Governing issue | Issue #261 — Runtime integration closure after W8. Owner sequencing override recorded 2026-07-23; Issue #354 UIA remains parked/open; RC5 remains parked/open. |',
              '| Governing issue | Issue #261 — Runtime integration closure after W8. RC6 is closed at its synthetic-only managed boundary; Issue #354 UIA remains parked/open; RC5 is resumed/open. |')
          replace_once(lock,
              '- W8 implementation claim is **RELEASED**. Current implementation ownership is RC6 under Issue #261 as declared in the Current lock table above.',
              '- W8 implementation claim is **RELEASED**. Current implementation ownership is RC5 under Issue #261 as declared in the Current lock table above.')
          replace_once(lock,
              '## RC5 implementation contract — SOURCE COMPLETE; MANAGED MATRIX PENDING',
              '## RC5 implementation contract — ACTIVE — SOURCE COMPLETE; MANAGED MATRIX PENDING')
          replace_once(lock,
              '10. RC5 remains `IMPLEMENTED_GATED / MANAGED MATRIX PENDING` until owner-controlled bootstrap verification, exact-current-main managed Test Lab execution, sanitized result/artifact evidence, permanent verifier promotion and status/ledger reconciliation are complete. Draft PR #378 remains preserved and parked until RC5 resumes after RC6 or an explicit later coordination decision.',
              '10. RC5 remains `IMPLEMENTED_GATED / MANAGED MATRIX PENDING` until final owner-controlled resource verification, exact-current-main managed Test Lab execution, sanitized result/artifact evidence, permanent verifier promotion and status/ledger reconciliation are complete. Draft PR #378 is preserved and may proceed only after the owner-side verification checkpoint passes; it must not merge on assumed or stale infrastructure state.')
          replace_once(lock,
              '8. Existing backend, Android, PWA, portal, supply-chain, privacy, authorization and integration regressions remain mandatory; RC6 must not weaken them.',
              '8. Existing backend, Android, PWA, portal, supply-chain, privacy, authorization and integration regressions remain mandatory; RC5 must not weaken them.')
          replace_once(lock,
              '9. UIA Issue #354 remains open for remaining owner-access/acceptance evidence but is read-only/parked while RC6 owns the single write lane.',
              '9. UIA Issue #354 remains open for remaining owner-access/acceptance evidence but is read-only/parked while RC5 owns the single write lane.')
          replace_once(lock,
              '## RC6 implementation contract — ACTIVE OWNER-AUTHORIZED CHECKPOINT',
              '## RC6 implementation contract — CLOSED AND PRESERVED')
          replace_once(lock,
              '10. Existing RC0–RC5, UIA, backend/database/OpenAPI, Android/PWA/portal, payment, privacy, authorization and production-release gates remain regression-protected.',
              '10. RC6 is `CLOSED — ACTIVE SYNTHETIC-ONLY MANAGED CANARY`: exact-current-main managed run `30137700769` on source `8838b7a6d726a5aed44ce21a39506c1265a98d15` passed the private outbox → Meta `hello_world` test-template send → authentic signed webhook receipt path on retry. The initial pre-provider Google Cloud CLI setup failure remains preserved in Issue #404. Existing RC0–RC5, UIA, backend/database/OpenAPI, Android/PWA/portal, payment, privacy, authorization and production-release gates remain regression-protected; production/participant WhatsApp delivery remains disabled.')
          replace_once(lock,
              '- RC5 — Firebase Test Lab device-matrix automation. **PARKED / NOT CLOSED — source PR #377 plus IAM correction PR #379 are merged; least-privilege custom roles and dedicated results bucket have been created/partially verified; final owner-side verification and exact-current-main managed matrix proof are pending because Cloud Shell is temporarily quota-blocked; draft PR #378 preserved.**',
              '- RC5 — Firebase Test Lab device-matrix automation. **ACTIVE RESUMED / NOT CLOSED — source PR #377 plus IAM correction PR #379 are merged; least-privilege custom roles and dedicated results bucket are preserved; final owner-side verification and exact-current-main managed matrix proof remain required; draft PR #378 is preserved and gated on verified infrastructure state.**')
          replace_once(lock,
              '- UIA — post-VC owner-review promotion. **PARKED / OPEN — PR #385 merged at `fed6db8ab7c479b5e47095b4f0a752514122a4f6`; Issue #354 remains open for remaining owner-access evidence; read-only while RC6 owns the lane.**',
              '- UIA — post-VC owner-review promotion. **PARKED / OPEN — PR #385 merged at `fed6db8ab7c479b5e47095b4f0a752514122a4f6`; Issue #354 remains open for remaining owner-access evidence; read-only while RC5 owns the lane.**')
          replace_once(lock,
              '- RC6 — WhatsApp Cloud API application adapter. **ACTIVE OWNER-AUTHORIZED CHECKPOINT — sequencing override permits RC6 source/runtime work while RC5 remains parked; production/participant sends remain gated.**',
              '- RC6 — WhatsApp Cloud API application adapter. **CLOSED — ACTIVE SYNTHETIC-ONLY MANAGED CANARY — exact source `8838b7a6d726a5aed44ce21a39506c1265a98d15`; managed run `30137700769` succeeded on retry through outbox → Meta test template → authentic signed webhook receipt; initial failure preserved in Issue #404; production/participant sends remain disabled.**')
          replace_once(lock,
              'RC6 under Issue #261 is the sole active implementation lane under the owner-authorized 2026-07-23 sequencing override. RC5 remains parked/not closed and PR #378 must not merge while RC6 owns the lane; owner-side RC5 read-only verification may resume when Cloud Shell access returns but cannot be represented as RC5 closure without exact-current-main managed Test Lab proof. UIA Issue #354 remains parked/read-only and its protected surfaces must not be modified outside RC6 necessity. RC7+ source work must not begin until RC6 releases or is explicitly re-coordinated.',
              'RC5 Firebase Test Lab is the sole active implementation lane under Issue #261. RC6 is closed and preserved at its synthetic-only managed boundary; its provider, secret, webhook and production-disable controls must not be weakened. PR #378 may proceed only after final owner-side read-only verification confirms the existing least-privilege resources, and RC5 cannot be represented as closed without exact-current-main managed Test Lab proof. UIA Issue #354 remains parked/read-only. RC7+ source work must not begin until RC5 releases or is explicitly re-coordinated.')

          verifier = 'scripts/rc6/verify-whatsapp-contract.py'
          old_lock_check = '''    for needle in (
        "CLAIMED — RC6 WhatsApp Cloud API",
        "RC6 implementation contract — ACTIVE OWNER-AUTHORIZED CHECKPOINT",
        "RC6 under Issue #261 is the sole active implementation lane",
        "RC5 remains parked/not closed",
        "Production/participant WhatsApp delivery remains disabled",
    ):
        require(lock, needle, "RC6 lock boundary")
'''
          new_lock_check = '''    active_lock_needles = (
        "CLAIMED — RC6 WhatsApp Cloud API",
        "RC6 implementation contract — ACTIVE OWNER-AUTHORIZED CHECKPOINT",
        "RC6 under Issue #261 is the sole active implementation lane",
        "RC5 remains parked/not closed",
        "Production/participant WhatsApp delivery remains disabled",
    )
    closed_lock_needles = (
        "CLAIMED — RC5 Firebase Test Lab device-matrix closure",
        "RC6 implementation contract — CLOSED AND PRESERVED",
        "RC6 exact-current-main managed run `30137700769`",
        "RC5 Firebase Test Lab is the sole active implementation lane",
        "production/participant WhatsApp delivery remains disabled",
    )
    active_lock = all(needle in lock for needle in active_lock_needles)
    closed_lock = all(needle in lock for needle in closed_lock_needles)
    if active_lock == closed_lock:
        raise AssertionError(
            "RC6 lock must be exactly one supported state: active RC6 or closed/preserved RC6 with RC5 resumed."
        )
'''
          replace_once(verifier, old_lock_check, new_lock_check)

          status = 'docs/integrations/CURRENT_INTEGRATION_STATUS.md'
          replace_once(status, '**Authoritative as-of date:** 2026-07-22 (Asia/Tokyo)  ', '**Authoritative as-of date:** 2026-07-25 (Asia/Tokyo)  ')
          replace_once(status,
              '| Firebase Test Lab | **IMPLEMENTED_GATED / MANAGED MATRIX PENDING** | RC5 source now repairs the current Android instrumentation contract, executes it in Android CI, builds an exact-source Test Lab workflow, selects a 2–3 device matrix from the live virtual catalog, and defines an owner-provisioned custom-role/dedicated-results-bucket boundary. Owner bootstrap and exact-main managed matrix evidence remain required before ACTIVE status. |',
              '| Firebase Test Lab | **ACTIVE RESUMED CHECKPOINT / IMPLEMENTED_GATED — MANAGED MATRIX PENDING** | RC5 source repairs the current Android instrumentation contract, executes it in Android CI, builds an exact-source Test Lab workflow, selects a 2–3 device matrix from the live virtual catalog, and preserves the owner-provisioned custom-role/dedicated-results-bucket boundary. Final owner-side verification and exact-current-main managed matrix evidence remain required before closure. |')
          replace_once(status,
              '| WhatsApp Cloud API | **IMPLEMENTED_GATED / MANAGED CANARY PENDING** | RC6 backend-only provider-neutral Meta adapter, transactional outbox, hashed opt-out, template-only payload boundary, raw-body HMAC webhook verification, durable idempotent receipts/retries and synthetic canary entrypoint are implemented. Provider business/phone/template/secret state and managed synthetic proof are not yet verified. Only Meta test/synthetic assets plus one owner-controlled verified recipient may be used for proof; participant/production delivery remains disabled. |',
              '| WhatsApp Cloud API | **CLOSED — ACTIVE SYNTHETIC-ONLY MANAGED CANARY** | RC6 exact-current-main managed run `30137700769` on source `8838b7a6d726a5aed44ce21a39506c1265a98d15` passed backend transactional outbox → Meta `hello_world` test-template send → authentic signed webhook receipt on retry. The initial pre-provider Google Cloud CLI setup failure remains preserved in Issue #404. Backend-only credentials, hashed opt-out, template-only payloads, HMAC verification, durable idempotent receipts/retries and kill switches remain enforced. Participant/production delivery remains disabled. |')
          replace_once(status,
              '7. RC5 Firebase Test Lab — **PARKED / NOT CLOSED — IMPLEMENTED_GATED / MANAGED MATRIX PENDING**; source contract, local instrumentation, least-privilege roles and dedicated results bucket are preserved. Final owner-side read-only verification and exact-current-main managed Test Lab evidence remain pending because Cloud Shell is temporarily quota-blocked.',
              '7. RC5 Firebase Test Lab — **ACTIVE RESUMED / NOT CLOSED — IMPLEMENTED_GATED / MANAGED MATRIX PENDING**; source contract, local instrumentation, least-privilege roles and dedicated results bucket are preserved. Final owner-side read-only verification and exact-current-main managed Test Lab evidence remain required before closure.')
          replace_once(status,
              '8. RC6 WhatsApp Cloud API application adapter — **ACTIVE CHECKPOINT / IMPLEMENTED_GATED — MANAGED CANARY PENDING**; fail-closed backend/outbox/webhook/opt-out source is implemented and regression-proven; managed provider proof remains pending. Meta test/synthetic number plus one owner-controlled verified recipient only; production phone registration, production templates and participant/live WhatsApp traffic remain gated.',
              '8. RC6 WhatsApp Cloud API application adapter — **CLOSED — ACTIVE SYNTHETIC-ONLY MANAGED CANARY**; exact-current-main run `30137700769` on `8838b7a6d726a5aed44ce21a39506c1265a98d15` passed outbox → Meta `hello_world` test-template send → authentic signed webhook receipt on retry; first-attempt setup failure remains preserved in Issue #404. Production phone/templates and participant/live WhatsApp traffic remain disabled/gated.')
          replace_once(status,
              'Continuous, controlled-pilot participant and production external email remain disabled. Participant/production push remains disabled after RC4 synthetic proof; any participant activation requires a later explicit privacy/release authorization. The 2026-07-22 owner bootstrap verified the fixed FCM canary secret container and its secret-scoped least-privilege bindings without creating, reading or printing a secret value.',
              'Continuous, controlled-pilot participant and production external email remain disabled. Participant/production push remains disabled after RC4 synthetic proof; participant/production WhatsApp delivery remains disabled after RC6 synthetic proof. Any participant activation requires later explicit provider/business/legal/privacy/release authorization. The 2026-07-22 owner bootstrap verified the fixed FCM canary secret container and its secret-scoped least-privilege bindings without creating, reading or printing a secret value.')

          ledger = 'docs/integrations/LIVE_INTEGRATION_LEDGER.md'
          replace_once(ledger, '**Last reconciled:** 2026-07-23 (Asia/Tokyo)', '**Last reconciled:** 2026-07-25 (Asia/Tokyo)')
          replace_once(ledger,
              '| WhatsApp Cloud API | `IMPLEMENTED_GATED / MANAGED CANARY PENDING` | RC6 implements a backend-only provider-neutral Meta template adapter through the transactional outbox, send-time synthetic approval/opt-out re-check, hashed opt-out state, bounded retry/idempotency, raw-body HMAC webhook verification, durable out-of-order-safe receipts and a synthetic canary entrypoint. Provider business/WABA/phone/template/secret state and managed proof are not yet verified. Only Meta test/synthetic assets plus one owner-controlled verified recipient may be used for proof; participant/production delivery, production phone registration and production templates remain disabled/gated. |',
              '| WhatsApp Cloud API | `CLOSED — ACTIVE SYNTHETIC-ONLY MANAGED CANARY` | RC6 exact-current-main run `30137700769` on source `8838b7a6d726a5aed44ce21a39506c1265a98d15` passed transactional outbox → Meta `hello_world` test-template send → authentic signed webhook receipt on retry. The initial pre-provider Google Cloud CLI setup failure remains preserved in Issue #404. Backend-only credentials, send-time synthetic approval/opt-out, hashed opt-out state, bounded retry/idempotency, HMAC verification, durable out-of-order-safe receipts and fail-closed kill switches remain enforced. Participant/production delivery, production phone registration and production templates remain disabled/gated. |')
          replace_once(ledger,
              '| Firebase Test Lab | `PARKED / NOT CLOSED — IMPLEMENTED_GATED / MANAGED MATRIX PENDING` | RC5 source and local instrumentation are integrated; least-privilege custom roles and dedicated 30-day results bucket were created and partially verified. Final owner-side read-only verification and exact-current-main managed matrix proof remain pending because Cloud Shell is temporarily quota-blocked. Draft proof bridge #378 remains preserved; no production/participant authorization is created. |',
              '| Firebase Test Lab | `ACTIVE RESUMED / NOT CLOSED — IMPLEMENTED_GATED / MANAGED MATRIX PENDING` | RC5 source and local instrumentation are integrated; least-privilege custom roles and dedicated 30-day results bucket are preserved. Final owner-side read-only verification and exact-current-main managed matrix proof remain required. Draft proof bridge #378 remains preserved and gated on verified infrastructure state; no production/participant authorization is created. |')
          closure_anchor = 'Controlled-pilot participant and production FCM delivery remain disabled during RC4. Device-token registration is fail-closed unless a later controlled-pilot authorization explicitly enables the source-controlled registration gate. The 2026-07-22 owner bootstrap created no secret value and verified `roles/secretmanager.secretVersionManager` only for the GitHub deployer and `roles/secretmanager.secretAccessor` only for the runtime identity on the fixed canary secret.\n'
          closure_block = closure_anchor + '''

### RC6 WhatsApp Cloud API closure receipt

```text
Integration: WhatsApp Cloud API application adapter (RC6)
Previous state: IMPLEMENTED_GATED / MANAGED CANARY PENDING
New state: CLOSED — ACTIVE SYNTHETIC-ONLY MANAGED CANARY
External provisioning: DIREKT Meta test/synthetic WABA 904315252104562; test phone-number ID 1146158541925026; explicit Graph API v25.0; Meta-provided hello_world template; one owner-controlled verified test recipient; callback and messages subscription owner-confirmed
