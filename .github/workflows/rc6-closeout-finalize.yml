          replace_once(ledger,
              '7. RC5 Firebase Test Lab — **ACTIVE CHECKPOINT / IMPLEMENTED_GATED — MANAGED MATRIX PENDING**. Source integration and local instrumentation execution are present; owner bootstrap plus exact-main managed matrix evidence remain required before closure.',
              '7. RC5 Firebase Test Lab — **ACTIVE RESUMED / NOT CLOSED — IMPLEMENTED_GATED / MANAGED MATRIX PENDING**. Source integration, local instrumentation and least-privilege resources are preserved; final owner-side verification plus exact-current-main managed matrix evidence remain required before closure.')
          replace_once(ledger,
              '8. RC6 WhatsApp runtime adapter.',
              '8. RC6 WhatsApp runtime adapter — **CLOSED — ACTIVE SYNTHETIC-ONLY MANAGED CANARY**. Exact source `8838b7a6d726a5aed44ce21a39506c1265a98d15`; managed run `30137700769` succeeded on retry; initial failure preserved in Issue #404; participant/production delivery disabled.')

          project = 'PROJECT_STATUS.md'
          replace_once(project, '**Updated:** 2026-07-21 (Asia/Tokyo)  ', '**Updated:** 2026-07-25 (Asia/Tokyo)  ')
          replace_once(project,
              '**Active repository write lane:** none; next material work requires a fresh claim',
              '**Active repository write lane:** RC5 Firebase Test Lab resumed under Issue #261; RC6 closed at its synthetic-only managed boundary')
          replace_once(project,
              '- runtime integration closure — **RC1 Resend closed at its managed synthetic boundary; RC2 Sentry is the next planned bounded checkpoint after a fresh lane claim**.',
              '- runtime integration closure — **RC1–RC4 and RC6 are closed at synthetic-only managed boundaries; RC5 Firebase Test Lab is resumed and remains open pending final owner verification plus exact-current-main matrix proof**.')
          replace_once(project,
              '- RC1 Resend has managed synthetic outbox → provider proof, while real-participant/continuous production email remains separately gated;',
              '- RC1 Resend, RC4 FCM and RC6 WhatsApp have managed synthetic outbox → provider/device or authentic provider-receipt proof, while real-participant/continuous production communications remain separately gated;')

          for path in (
              lock,
              verifier,
              status,
              ledger,
              project,
          ):
              text = Path(path).read_text(encoding='utf-8')
              if '\r' in text:
                  raise SystemExit(f'{path}: CR character introduced')
          PY
          git diff --check

      - name: Verify permanent RC5 and closed RC6 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rc5/verify-test-lab-contract.py
          python3 scripts/rc6/verify-whatsapp-contract.py
          python3 scripts/rc6/verify-whatsapp-managed-identity.py
          python3 scripts/rc6/verify-whatsapp-infra-preflight.py
          python3 scripts/rc6/verify-whatsapp-prepare-bridge.py
          python3 scripts/rc6/verify-whatsapp-run-bridge.py
          grep -Fq 'CLOSED — ACTIVE SYNTHETIC-ONLY MANAGED CANARY' docs/integrations/CURRENT_INTEGRATION_STATUS.md
          grep -Fq 'Managed canary evidence: run 30137700769 SUCCESS on retry' docs/integrations/LIVE_INTEGRATION_LEDGER.md
          grep -Fq 'RC5 Firebase Test Lab is the sole active implementation lane' WORKSTREAM_LOCK.md
          grep -Fq 'Production-release authorization | BLOCKED' WORKSTREAM_LOCK.md

      - name: Commit closure reconciliation and self-remove
        shell: bash
        env:
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git rm .github/workflows/rc6-closeout-finalize.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            WORKSTREAM_LOCK.md \
            PROJECT_STATUS.md \
            docs/integrations/CURRENT_INTEGRATION_STATUS.md \
            docs/integrations/LIVE_INTEGRATION_LEDGER.md \
            scripts/rc6/verify-whatsapp-contract.py
          git commit -m "chore(rc6): close managed WhatsApp checkpoint"
          git push origin "HEAD:${EXPECTED_BRANCH}"
