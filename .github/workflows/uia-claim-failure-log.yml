name: UIA claim failure log

on:
  pull_request:
    paths:
      - ".github/workflows/uia-claim-failure-log.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/uia-current-main-refresh-claim'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_JOB_ID: "90125618343"
    steps:
      - name: Print failure tail
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/uia-claim.log"
          clean="${RUNNER_TEMP}/uia-claim-clean.log"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" > "${raw}"
          sed -r 's/\x1B\[[0-9;]*[mK]//g; s/^.*Z //' "${raw}" > "${clean}"
          tail -n 70 "${clean}"
