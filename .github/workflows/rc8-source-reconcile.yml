name: RC8 source reconciler

on:
  pull_request:
    paths:
      - ".github/workflows/rc8-source-reconcile.yml"
      - "scripts/rc8/patch-source-reconciliation.py"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'integration/rc8-sandbox-payments'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/rc8-sandbox-payments
          fetch-depth: 0
      - name: Reconcile RC8 source checkpoint with closed RC7 baseline
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/rc8/patch-source-reconciliation.py ]]; then
            echo 'RC8 source checkpoint already reconciled.'
            exit 0
          fi
          python3 scripts/rc8/patch-source-reconciliation.py
          python3 scripts/rc8/verify-payments-contract.py
          python3 scripts/rc5/verify-test-lab-closure.py
          python3 scripts/rc6/verify-whatsapp-contract.py
          python3 scripts/rc7/verify-maps-contract.py
          python3 -m py_compile \
            scripts/rc8/verify-payments-contract.py \
            scripts/rc5/verify-test-lab-closure.py \
            scripts/rc6/verify-whatsapp-contract.py \
            scripts/rc7/verify-maps-contract.py
          sed -i 's/[[:space:]]\+$//' docs/integrations/RC8_SANDBOX_PAYMENTS_IMPLEMENTATION.md
          rm scripts/rc8/patch-source-reconciliation.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/integrations/RC8_SANDBOX_PAYMENTS_IMPLEMENTATION.md \
            scripts/rc8/verify-payments-contract.py \
            scripts/rc8/patch-source-reconciliation.py
          git diff --cached --check
          git commit -m 'docs(rc8): reconcile source checkpoint after Maps closure'
          git push origin HEAD:integration/rc8-sandbox-payments
