name: Temporary Phase 11 terminal marker patch

on:
  push:
    branches:
      - chore/lively-marketplace-closure
    paths:
      - ".github/workflows/temporary-patch-phase11-terminal-markers.yml"

permissions:
  contents: write

jobs:
  patch-and-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/lively-marketplace-closure
          fetch-depth: 0
      - name: Preserve terminal disposition markers and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lock = Path("WORKSTREAM_LOCK.md")
          text = lock.read_text(encoding="utf-8")
          heading = "## Phase 11 terminal administrative disposition — CLOSED AND PRESERVED"
          block = """## Phase 11 terminal administrative disposition — CLOSED AND PRESERVED

- RELEASED — PHASE 11 TRACKER CLOSED NOT PLANNED.
- P11-G01–P11-G13 remain unsatisfied.
- `PILOT_ENTRY_APPROVED` remains false.
- PRIMARY-PILOT evidence count remains 0.
- The real Phase 11 pilot was not run and is not complete.
- No primary pilot evidence or evidence-backed 11J `PROCEED` exists.

"""
          anchor = "## W8 historical closure receipt — CLOSED AND PRESERVED"
          if heading not in text:
              text = text.replace(anchor, block + anchor, 1)
              lock.write_text(text, encoding="utf-8")
          Path(".github/workflows/temporary-patch-phase11-terminal-markers.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WORKSTREAM_LOCK.md .github/workflows/temporary-patch-phase11-terminal-markers.yml
          git commit -m "docs(ui): preserve Phase 11 terminal markers"
          git push origin HEAD:chore/lively-marketplace-closure
