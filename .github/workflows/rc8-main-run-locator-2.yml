name: RC8 exact-main run locator 2

on:
  pull_request:
    paths:
      - ".github/workflows/rc8-main-run-locator-2.yml"

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  locate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/rc8-main-run-locator-2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: ccc4e9463d810ddf554182b1607c22d3a7c8c8d3
    steps:
      - name: Locate and report the exact-main RC8 run
        shell: bash
        run: |
          set -euo pipefail
          run=''
          for _ in $(seq 1 90); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/rc8-payments-managed.yml/runs?branch=main&event=push&per_page=20")"
            run="$(jq -c --arg sha "${EXACT_MAIN}" '.workflow_runs[] | select(.head_sha == $sha) | {id,run_number,run_attempt,status,conclusion,html_url,head_sha,event,created_at,updated_at}' <<< "${runs}" | head -n 1)"
            if [[ -n "${run}" ]] && [[ "$(jq -r '.status' <<< "${run}")" == "completed" ]]; then
              break
            fi
            sleep 10
          done
          test -n "${run}"
          run_id="$(jq -r '.id' <<< "${run}")"
          jobs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" | jq '[.jobs[] | {id,name,status,conclusion,started_at,completed_at}]')"
          artifacts="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" | jq '[.artifacts[] | {id,name,size_in_bytes,expired,created_at,updated_at,digest}]')"
          body="${RUNNER_TEMP}/rc8-main-run-locator-2.md"
          {
            echo '## RC8 corrected exact-main workflow locator'
            echo
            echo "- Exact main: \`${EXACT_MAIN}\`"
            echo
            echo '### Run'
            echo '```json'
            jq . <<< "${run}"
            echo '```'
            echo
            echo '### Jobs'
            echo '```json'
            jq . <<< "${jobs}"
            echo '```'
            echo
            echo '### Artifacts'
            echo '```json'
            jq . <<< "${artifacts}"
            echo '```'
          } > "${body}"
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${GITHUB_REPOSITORY}" --body-file "${body}"
