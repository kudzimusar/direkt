name: RC7 reconcile log extractor

on:
  pull_request:
    paths:
      - ".github/workflows/rc7-reconcile-log-extractor.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/rc7-deterministic-apk-certificate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_JOB_ID: "89865865360"
    steps:
      - name: Print bounded reconciler failure
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/job.log"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" > "${raw}"
          grep -E 'RC7_RECONCILE_FAILED_STAGE|missing expected source|AssertionError|Traceback|SyntaxError|Prohibited pattern|Missing |Expected exactly|must |drifted|Process completed with exit code' "${raw}" \
            | tail -n 80 || true
