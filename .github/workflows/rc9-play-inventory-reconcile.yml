name: RC9 Play SDK inventory reconciler

on:
  pull_request:
    paths:
      - ".github/workflows/rc9-play-inventory-reconcile.yml"
      - "scripts/rc9/patch-play-sdk-inventory.py"

permissions:
  contents: write

concurrency:
  group: rc9-play-inventory-reconcile-${{ github.ref }}
  cancel-in-progress: true

env:
  DIREKT_GRADLE_VERSION: "9.4.0"

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/rc9-generated-client-runtime-adoption'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/rc9-generated-client-runtime-adoption
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.DIREKT_GRADLE_VERSION }}
      - name: Reconcile and prove RC9 Play inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rc9/patch-play-sdk-inventory.py
          python3 -m json.tool docs/phase12/play/data_safety_inventory.json >/dev/null

          pushd android/direkt-app >/dev/null
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle wrapper --gradle-version "${DIREKT_GRADLE_VERSION}" --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache :app:processReleaseMainManifest
          MERGED_MANIFEST="$(find app/build/intermediates -type f -name AndroidManifest.xml -path '*merged_manifest*release*' -print -quit)"
          test -n "${MERGED_MANIFEST}"
          DEPENDENCY_REPORT="${GITHUB_WORKSPACE}/release-runtime-dependencies.txt"
          ./gradlew --no-daemon --no-configuration-cache :app:dependencies \
            --configuration releaseRuntimeClasspath > "${DEPENDENCY_REPORT}"
          test -s "${DEPENDENCY_REPORT}"
          popd >/dev/null

          export DIREKT_MERGED_MANIFEST_PATH="${GITHUB_WORKSPACE}/android/direkt-app/${MERGED_MANIFEST}"
          export DIREKT_REQUIRE_MERGED_MANIFEST=true
          export DIREKT_RELEASE_RUNTIME_DEPENDENCIES_PATH="${DEPENDENCY_REPORT}"
          export DIREKT_REQUIRE_RELEASE_RUNTIME_DEPENDENCIES=true
          python3 scripts/verify-phase12-play-readiness.py
          python3 scripts/rc9/verify-generated-foundation.py
          python3 scripts/rc9/verify-generated-client-contract.py

          rm scripts/rc9/patch-play-sdk-inventory.py
          rm .github/workflows/rc9-play-inventory-reconcile.yml
          rm .github/workflows/rc9-regression-failure-log.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/verify-phase12-play-readiness.py \
            docs/phase12/play/data_safety_inventory.json \
            scripts/rc9/patch-play-sdk-inventory.py \
            .github/workflows/rc9-play-inventory-reconcile.yml \
            .github/workflows/rc9-regression-failure-log.yml
          git diff --cached --check
          git commit -m 'docs(rc9): reconcile Play SDK inventory'
          git push origin HEAD:feat/rc9-generated-client-runtime-adoption
