name: RC9A foundation failure log

on:
  pull_request:
    paths:
      - ".github/workflows/rc9a-foundation-failure-log.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/rc9a-deterministic-generated-clients'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_JOB_ID: "89963893547"
    steps:
      - name: Print bounded foundation failure
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/rc9a-foundation.log"
          clean="${RUNNER_TEMP}/rc9a-foundation-clean.log"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" > "${raw}"
          sed -r 's/\x1B\[[0-9;]*[mK]//g; s/^.*Z //' "${raw}" > "${clean}"
          grep -E '(##\[error\]|Process completed|AssertionError|Traceback|RC9 contract missing|RC9A_|BUILD FAILED|FAILED|error:|trailing whitespace|new blank line|fatal:)' "${clean}" | tail -n 160
