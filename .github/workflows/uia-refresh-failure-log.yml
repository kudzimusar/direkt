name: UIA refresh failure log

on:
  pull_request:
    paths:
      - ".github/workflows/uia-refresh-failure-log.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/uia-current-main-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_JOB_ID: "90128271752"
    steps:
      - name: Print browser image-build failure
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/uia-browser.log"
          clean="${RUNNER_TEMP}/uia-browser-clean.log"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" > "${raw}"
          sed -r 's/\x1B\[[0-9;]*[mK]//g; s/^.*Z //' "${raw}" > "${clean}"
          echo '=== BUILD FAILURE ==='
          grep -n -E 'ERROR|Error|error|failed|failure|npm ERR|ELIFECYCLE|Dockerfile|process .* did not complete|exit code' "${clean}" | tail -n 160 || true
          echo '=== FINAL BUILD TAIL ==='
          tail -n 120 "${clean}"
