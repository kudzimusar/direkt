name: UIA refresh failure log

on:
  pull_request:
    paths:
      - ".github/workflows/uia-refresh-failure-log.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/uia-current-main-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_JOB_ID: "90128240252"
    steps:
      - name: Print browser failure identity and errors
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/uia-refresh.log"
          clean="${RUNNER_TEMP}/uia-refresh-clean.log"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" > "${raw}"
          sed -r 's/\x1B\[[0-9;]*[mK]//g; s/^.*Z //' "${raw}" > "${clean}"
          echo '=== RUN IDENTITIES ==='
          grep -E 'DIREKT functional web W8 managed public cutover|DIREKT Firebase internal Android distribution|DIREKT controlled Cloud Run staging' "${clean}" | grep -E '· [0-9]+' | sort -u || true
          echo '=== BROWSER FAILURE CONTEXT ==='
          grep -n -E 'functional web W8 managed public cutover|Browser=|failure|failed|error|cancelled|conclusion' "${clean}" | tail -n 160 || true
