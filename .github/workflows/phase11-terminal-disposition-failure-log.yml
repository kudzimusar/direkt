name: Phase 11 terminal disposition failure log

on:
  pull_request:
    paths:
      - ".github/workflows/phase11-terminal-disposition-failure-log.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/phase11-terminal-administrative-disposition'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_JOB_ID: "90145409674"
    steps:
      - name: Print terminal disposition failure tail
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/phase11-terminal.log"
          clean="${RUNNER_TEMP}/phase11-terminal-clean.log"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" > "${raw}"
          sed -r 's/\x1B\[[0-9;]*[mK]//g; s/^.*Z //' "${raw}" > "${clean}"
          tail -n 120 "${clean}"