name: Phase 11 terminal disposition wording fix

on:
  pull_request:
    paths:
      - ".github/workflows/phase11-terminal-disposition-failure-log.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/phase11-terminal-administrative-disposition'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/phase11-terminal-administrative-disposition
      - name: Normalize verifier-compatible wording
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/phase11/publish-terminal-administrative-disposition.py')
          text = path.read_text(encoding='utf-8')
          old = 'It is **not** an evidence-backed Phase 11J STOP decision'
          new = 'It is not an evidence-backed Phase 11J STOP decision'
          if old not in text:
              print('Terminal disposition wording already normalized')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/phase11/publish-terminal-administrative-disposition.py
          git diff --cached --check
          git commit -m 'fix(phase11): normalize terminal disposition wording'
          git push origin HEAD:docs/phase11-terminal-administrative-disposition