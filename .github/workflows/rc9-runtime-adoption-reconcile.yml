name: RC9 generated-client runtime adoption reconciler

on:
  pull_request:
    paths:
      - ".github/workflows/rc9-runtime-adoption-reconcile.yml"
      - "scripts/rc9/patch-runtime-adoption.py"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/rc9-generated-client-runtime-adoption'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/rc9-generated-client-runtime-adoption
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/direkt-api/package-lock.json
            web/direkt-app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Apply, regenerate and verify RC9B/C adoption
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rc9/patch-runtime-adoption.py

          pushd backend/direkt-api >/dev/null
          npm ci --ignore-scripts
          npm run openapi:check
          popd >/dev/null

          bash scripts/rc9/generate-clients.sh --write
          bash scripts/rc9/generate-clients.sh --check

          chmod +x android/direkt-app/gradlew
          android/direkt-app/gradlew \
            --project-dir android/direkt-app \
            --no-daemon \
            --stacktrace \
            testDebugUnitTest lintDebug assembleDebug

          pushd web/direkt-app >/dev/null
          npm ci --ignore-scripts
          npm run typecheck
          npm run verify:auth
          popd >/dev/null

          python3 scripts/rc9/verify-generated-foundation.py
          python3 scripts/rc9/verify-generated-client-contract.py
          python3 scripts/rc8/verify-payments-contract.py
          python3 scripts/rc7/verify-maps-contract.py
          python3 scripts/rc6/verify-whatsapp-contract.py
          python3 scripts/rc5/verify-test-lab-closure.py

          rm scripts/rc9/patch-runtime-adoption.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            android/direkt-app/app/build.gradle.kts \
            web/direkt-app/lib/server/direkt-auth-api.ts \
            clients/generated \
            scripts/rc9/patch-runtime-adoption.py
          git diff --cached --check
          git commit -m 'feat(rc9): wire generated auth contracts'
          git push origin HEAD:feat/rc9-generated-client-runtime-adoption
