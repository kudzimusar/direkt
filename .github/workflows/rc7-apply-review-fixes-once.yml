name: DIREKT RC7 apply review fixes once

on:
  push:
    branches:
      - integration/runtime-closure-261
    paths:
      - "scripts/rc7/apply-review-fixes.py"
      - ".github/workflows/rc7-apply-review-fixes-once.yml"

permissions:
  contents: write

concurrency:
  group: direkt-rc7-apply-review-fixes-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/runtime-closure-261
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/direkt-api/package-lock.json
      - name: Apply deterministic review repairs
        run: python3 scripts/rc7/apply-review-fixes.py
      - name: Format backend source and tests
        working-directory: backend/direkt-api
        run: |
          npm ci --ignore-scripts
          npm run format
      - name: Verify repaired source contract
        run: |
          python3 scripts/rc7/verify-maps-contract.py
          cd backend/direkt-api
          npm run lint
          npm run typecheck
          npm run openapi:check
      - name: Commit repairs and remove one-shot bridge
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/rc7/apply-review-fixes.py
          rm .github/workflows/rc7-apply-review-fixes-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(rc7): connect privacy-safe Maps runtime"
          git push origin HEAD:integration/runtime-closure-261
