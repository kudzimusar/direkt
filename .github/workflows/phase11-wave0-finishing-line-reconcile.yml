name: Phase 11 Wave 0 finishing-line publisher

on:
  pull_request:
    paths:
      - ".github/workflows/phase11-wave0-finishing-line-reconcile.yml"
      - "scripts/phase11/patch-wave0-finishing-line.py"
      - "scripts/phase11/verify-wave0-finishing-line.py"
      - "scripts/phase11/evaluate-wave0-gates.py"
      - "docs/phase11/PHASE11_WAVE0_*"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'phase11/wave0-finishing-line-implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase11/wave0-finishing-line-implementation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply and verify Wave 0 finishing line
        run: |
          set -euo pipefail
          python3 scripts/phase11/patch-wave0-finishing-line.py
          python3 scripts/rc11/verify-final-integration-closure.py
          python3 scripts/phase11/verify-primary-pilot-readiness.py
          python3 scripts/phase11/evaluate-wave0-gates.py
          python3 scripts/phase11/verify-wave0-finishing-line.py
          rm scripts/phase11/patch-wave0-finishing-line.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add WORKSTREAM_LOCK.md PROJECT_STATUS.md docs/phase11/PHASE11_EXECUTION_AND_ENTRY_CONTROL.md docs/phase11/PHASE11_REAL_ENTRY_BLOCKER_REGISTER_2026-07-28.md scripts/phase11/patch-wave0-finishing-line.py
          git diff --cached --check
          git commit -m 'docs(phase11): publish Wave 0 finishing-line controls'
          git push origin HEAD:phase11/wave0-finishing-line-implementation
