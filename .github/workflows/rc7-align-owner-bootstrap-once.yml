name: DIREKT RC7 align owner bootstrap once

# One-shot bridge: applies the reviewed bootstrap alignment, verifies it, then deletes itself.
on:
  push:
    branches:
      - integration/runtime-closure-261
    paths:
      - "scripts/rc7/align-managed-bootstrap-once.py"
      - ".github/workflows/rc7-align-owner-bootstrap-once.yml"

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/runtime-closure-261
          fetch-depth: 0
      - run: python3 scripts/rc7/align-managed-bootstrap-once.py
      - name: Verify aligned owner bootstrap
        run: |
          bash -n scripts/rc7/bootstrap-maps-managed.sh
          bash -n scripts/rc7/run-maps-managed.sh
          python3 scripts/rc7/verify-maps-contract.py
      - name: Commit alignment and remove bridge
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/rc7/align-managed-bootstrap-once.py
          rm .github/workflows/rc7-align-owner-bootstrap-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(rc7): enforce owner-scoped Maps bootstrap"
          git push origin HEAD:integration/runtime-closure-261
