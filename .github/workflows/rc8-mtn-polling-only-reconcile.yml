name: RC8 MTN polling-only canary reconciler

on:
  pull_request:
    paths:
      - ".github/workflows/rc8-mtn-polling-only-reconcile.yml"
      - "scripts/rc8/patch-mtn-polling-only-canary.py"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/rc8-mtn-polling-only-canary'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/rc8-mtn-polling-only-canary
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/direkt-api/package-lock.json
      - name: Apply and validate the bounded RC8 correction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rc8/patch-mtn-polling-only-canary.py
          pushd backend/direkt-api >/dev/null
          npm ci --ignore-scripts
          npx prettier --write \
            src/commercial/mtn-momo-sandbox-payment-provider.adapter.ts \
            src/commercial/rc8-payment-canary.ts \
            test/unit/mtn-momo-sandbox-payment-provider.adapter.spec.ts
          npm run format:check
          npm run lint
          npm run typecheck
          npx vitest run \
            test/unit/mtn-momo-sandbox-payment-provider.adapter.spec.ts \
            test/unit/rc8-sandbox-payment-provider.spec.ts \
            test/unit/stripe-sandbox-payment-provider.adapter.spec.ts \
            test/unit/paypal-sandbox-payment-provider.adapter.spec.ts \
            test/unit/dpo-sandbox-payment-provider.adapter.spec.ts \
            test/unit/sandbox-payment-reconciliation.spec.ts
          npm run build
          popd >/dev/null
          python3 scripts/rc8/verify-payments-contract.py
          python3 scripts/rc5/verify-test-lab-closure.py
          python3 scripts/rc6/verify-whatsapp-contract.py
          python3 scripts/rc7/verify-maps-contract.py
          python3 -m py_compile \
            scripts/rc8/verify-payments-contract.py \
            scripts/rc5/verify-test-lab-closure.py \
            scripts/rc6/verify-whatsapp-contract.py \
            scripts/rc7/verify-maps-contract.py
          bash -n scripts/rc8/run-payments-managed.sh
          sed -i 's/[[:space:]]\+$//' \
            docs/integrations/RC8_SANDBOX_PAYMENTS_IMPLEMENTATION.md
          rm \
            scripts/rc8/patch-mtn-polling-only-canary.py \
            .github/workflows/rc8-mtn-polling-only-reconcile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/direkt-api/src/commercial/mtn-momo-sandbox-payment-provider.adapter.ts \
            backend/direkt-api/src/commercial/rc8-payment-canary.ts \
            backend/direkt-api/test/unit/mtn-momo-sandbox-payment-provider.adapter.spec.ts \
            docs/integrations/RC8_SANDBOX_PAYMENTS_IMPLEMENTATION.md \
            scripts/rc8/run-payments-managed.sh \
            scripts/rc8/verify-payments-contract.py \
            scripts/rc8/patch-mtn-polling-only-canary.py \
            .github/workflows/rc8-mtn-polling-only-reconcile.yml
          git diff --cached --check
          git commit -m 'fix(rc8): use polling-only MTN sandbox proof'
          git push origin HEAD:fix/rc8-mtn-polling-only-canary
