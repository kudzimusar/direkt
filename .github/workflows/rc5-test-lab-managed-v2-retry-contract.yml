name: DIREKT RC5 Test Lab managed v2 retry contract

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rc5-test-lab-managed-v2-retry-once.yml
      - .github/workflows/rc5-test-lab-managed-v2-retry-contract.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/rc5-test-lab-managed-v2-retry-once.yml
      - .github/workflows/rc5-test-lab-managed-v2-retry-contract.yml

permissions:
  contents: read

jobs:
  verify:
    name: Verify fail-closed RC5 v2 retry bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Parse retry workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require "yaml"
          path = ".github/workflows/rc5-test-lab-managed-v2-retry-once.yml"
          doc = YAML.safe_load(File.read(path), aliases: true)
          raise "workflow document must be a mapping" unless doc.is_a?(Hash)
          raise "unexpected workflow name" unless doc["name"] == "DIREKT RC5 Test Lab managed v2 retry bridge"
          push = doc.fetch("on").fetch("push")
          raise "main branch required" unless push.fetch("branches") == ["main"]
          raise "self path trigger required" unless push.fetch("paths") == [path]
          raise "permission drift" unless doc.fetch("permissions") == {
            "contents" => "read",
            "actions" => "write",
            "issues" => "write"
          }
          job = doc.fetch("jobs").fetch("dispatch")
          raise "timeout drift" unless job["timeout-minutes"] == 70
          raise "unexpected runner" unless job["runs-on"] == "ubuntu-latest"
          RUBY

      - name: Verify exact-source dispatch and evidence controls
        shell: bash
        run: |
          set -euo pipefail
          bridge=.github/workflows/rc5-test-lab-managed-v2-retry-once.yml
          grep -Fq 'test "${main_sha}" = "${source_sha}"' "${bridge}"
          grep -Fq 'workflow="firebase-test-lab-managed.yml"' "${bridge}"
          grep -Fq 'expected_name="DIREKT Firebase Test Lab Android matrix v2"' "${bridge}"
          grep -Fq 'confirmation:"RUN-DIREKT-TEST-LAB"' "${bridge}"
          grep -Fq 'candidate_count' "${bridge}"
          grep -Fq '.head_sha' "${bridge}"
          grep -Fq 'workflow_dispatch' "${bridge}"
          grep -Fq 'artifact_name="rc5-firebase-test-lab-${run_id}-${run_attempt}"' "${bridge}"
          grep -Fq '.schema == "direkt.rc5.test-lab-receipt.v1"' "${bridge}"
          grep -Fq '.sourceSha == $sha' "${bridge}"
          grep -Fq '.result == "passed"' "${bridge}"
          grep -Fq '.dataMode == "synthetic-public-safe-only"' "${bridge}"
          grep -Fq '.productionAuthorization == false' "${bridge}"
          grep -Fq 'select(.version == "33")' "${bridge}"
          grep -Fq 'select(. >= 35 and . <= 36)' "${bridge}"
          grep -Fq 'available_and_schema_validated' "${bridge}"
          grep -Fq 'repos/${repo}/issues/261/comments' "${bridge}"
          grep -Fq 'Participant/production authorization: false' "${bridge}"

      - name: Prohibit direct cloud and production authority
        shell: bash
        run: |
          set -euo pipefail
          bridge=.github/workflows/rc5-test-lab-managed-v2-retry-once.yml
          ! grep -Fq 'id-token: write' "${bridge}"
          ! grep -Fq 'google-github-actions/auth' "${bridge}"
          ! grep -Eq '(^|[[:space:]])gcloud([[:space:]]|$)' "${bridge}"
          ! grep -Fq 'firebase test android run' "${bridge}"
          ! grep -Eq 'projects (add|remove)-iam-policy-binding' "${bridge}"
          ! grep -Eq 'storage buckets (create|update|delete)' "${bridge}"
          ! grep -Fq 'secrets versions access' "${bridge}"
          ! grep -Ei '(private_key|client_secret|credentials_json)' "${bridge}"

      - name: Publish retry contract summary
        shell: bash
        run: |
          {
            echo '### RC5 Test Lab managed v2 retry contract'
            echo '- YAML: parsed'
            echo '- Dispatch: exact current main, one unique managed run'
            echo '- Evidence: receipt and standalone matrix schema validated'
            echo '- Bridge authority: GitHub Actions/issues only'
            echo '- Direct Google Cloud/Test Lab authority: absent'
            echo '- Participant/production authorization: false'
          } >> "${GITHUB_STEP_SUMMARY}"
