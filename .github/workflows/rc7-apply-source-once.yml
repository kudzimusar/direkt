name: DIREKT RC7 apply source slice once

on:
  push:
    branches:
      - integration/runtime-closure-261
    paths:
      - "scripts/rc7/apply-source-slice.py"
      - ".github/workflows/rc7-apply-source-once.yml"

permissions:
  contents: write

concurrency:
  group: direkt-rc7-apply-source-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/runtime-closure-261
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply exact RC7 source patch
        run: python3 scripts/rc7/apply-source-slice.py

      - name: Remove one-shot patch machinery and commit
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/rc7/apply-source-slice.py
          rm .github/workflows/rc7-apply-source-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(rc7): integrate privacy-safe Google Maps runtime"
          git push origin HEAD:integration/runtime-closure-261
