name: DIREKT UIA corrected-main closeout once

on:
  pull_request:
    paths:
      - ".github/workflows/uia-current-main-refresh-closeout-once.yml"
      - "scripts/uia/publish-current-main-refresh-closeout.py"

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: direkt-uia-corrected-main-closeout-once
  cancel-in-progress: false

jobs:
  closeout:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/uia-current-main-refresh-closeout'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: a7d1a383fb1d0737d014cd8e13fc3fa263596e65
      PR_NUMBER: ${{ github.event.pull_request.number }}
      WEB_WORKFLOW: functional-pwa-w8-managed-cutover.yml
      ANDROID_WORKFLOW: firebase-internal-distribution.yml
      OPERATIONS_WORKFLOW: cloud-run-staging-deploy-v2.yml
      CANONICAL_WORKFLOW: functional-pwa-w8-canonical-domain.yml
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/uia-current-main-refresh-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify source claim and preserved boundaries
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "${SOURCE_SHA}"
          grep -Fq 'CLAIMED — UIA EXACT-CURRENT-MAIN OWNER-REVIEW REFRESH' WORKSTREAM_LOCK.md
          python3 scripts/rc11/verify-final-integration-closure.py
          python3 scripts/phase11/verify-primary-pilot-readiness.py
          python3 scripts/phase11/evaluate-wave0-gates.py
      - name: Dispatch exact-source managed surfaces
        run: |
          set -euo pipefail
          gh workflow run "${WEB_WORKFLOW}" --repo "${GITHUB_REPOSITORY}" --ref main -f confirmation=RUN-DIREKT-W8-PUBLIC-WEB -f source_sha="${SOURCE_SHA}"
          gh workflow run "${ANDROID_WORKFLOW}" --repo "${GITHUB_REPOSITORY}" --ref main -f confirmation=DISTRIBUTE-DIREKT-INTERNAL -f source_sha="${SOURCE_SHA}"
          gh workflow run "${OPERATIONS_WORKFLOW}" --repo "${GITHUB_REPOSITORY}" --ref main -f confirmation=DEPLOY-DIREKT-STAGING -f source_sha="${SOURCE_SHA}"
      - name: Resolve managed run IDs
        run: |
          set -euo pipefail
          resolve_run() {
            local workflow="$1"
            for _ in $(seq 1 60); do
              run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${workflow}" --branch main --event workflow_dispatch --limit 50 --json databaseId,headSha,createdAt | jq -r --arg sha "${SOURCE_SHA}" '[.[] | select(.headSha == $sha)] | sort_by(.createdAt) | last | .databaseId // empty')"
              if [[ "${run_id}" =~ ^[0-9]+$ ]]; then printf '%s' "${run_id}"; return 0; fi
              sleep 2
            done
            return 1
          }
          echo "WEB_RUN_ID=$(resolve_run "${WEB_WORKFLOW}")" >> "${GITHUB_ENV}"
          echo "ANDROID_RUN_ID=$(resolve_run "${ANDROID_WORKFLOW}")" >> "${GITHUB_ENV}"
          echo "OPERATIONS_RUN_ID=$(resolve_run "${OPERATIONS_WORKFLOW}")" >> "${GITHUB_ENV}"
      - name: Require browser Android and operations success
        run: |
          set -euo pipefail
          set +e
          gh run watch "${WEB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status & web_pid=$!
          gh run watch "${ANDROID_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status & android_pid=$!
          gh run watch "${OPERATIONS_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status & operations_pid=$!
          wait "${web_pid}"; web_status=$?
          wait "${android_pid}"; android_status=$?
          wait "${operations_pid}"; operations_status=$?
          set -e
          test "${web_status}" -eq 0
          test "${android_status}" -eq 0
          test "${operations_status}" -eq 0
      - name: Verify canonical owner-review host
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "${SOURCE_SHA}"
          gh workflow run "${CANONICAL_WORKFLOW}" --repo "${GITHUB_REPOSITORY}" --ref main
          for _ in $(seq 1 60); do
            CANONICAL_RUN_ID="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${CANONICAL_WORKFLOW}" --branch main --event workflow_dispatch --limit 50 --json databaseId,headSha,createdAt | jq -r --arg sha "${SOURCE_SHA}" '[.[] | select(.headSha == $sha)] | sort_by(.createdAt) | last | .databaseId // empty')"
            [[ "${CANONICAL_RUN_ID}" =~ ^[0-9]+$ ]] && break
            sleep 2
          done
          [[ "${CANONICAL_RUN_ID}" =~ ^[0-9]+$ ]]
          echo "CANONICAL_RUN_ID=${CANONICAL_RUN_ID}" >> "${GITHUB_ENV}"
          gh run watch "${CANONICAL_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status
      - name: Publish and verify permanent UIA closeout
        run: |
          set -euo pipefail
          python3 scripts/uia/publish-current-main-refresh-closeout.py
          python3 scripts/uia/verify-current-main-owner-review.py
          git diff --check
      - name: Post managed receipt to Issue 354
        run: |
          set -euo pipefail
          gh issue comment 354 --repo "${GITHUB_REPOSITORY}" --body "## UIA exact-current-main refresh passed

Managed source: \`${SOURCE_SHA}\`

- Browser/PWA: \`${WEB_RUN_ID}\` — passed
- Internal Android: \`${ANDROID_RUN_ID}\` — passed
- IAM-private operations: \`${OPERATIONS_RUN_ID}\` — passed
- Canonical host: \`${CANONICAL_RUN_ID}\` — passed
- Browser: https://app.direkt.forum
- Android group: \`direkt-internal-testers\`
- Operations: \`direkt-operations-portal-staging\`
- Real participant UAT: not run
- Production release: not authorized

PR #${PR_NUMBER} contains the permanent receipt and released lock."
      - name: Commit closeout and remove one-shot controls
        run: |
          set -euo pipefail
          rm scripts/uia/publish-current-main-refresh-closeout.py
          rm .github/workflows/uia-current-main-refresh-closeout-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add WORKSTREAM_LOCK.md PROJECT_STATUS.md docs/design/UIA_CURRENT_MAIN_OWNER_REVIEW_RECEIPT.md scripts/uia/verify-current-main-owner-review.py .github/workflows/uia-current-main-owner-review-contract.yml scripts/uia/publish-current-main-refresh-closeout.py .github/workflows/uia-current-main-refresh-closeout-once.yml
          git diff --cached --check
          git commit -m 'docs(uia): close current-main owner review'
          git push origin HEAD:chore/uia-current-main-refresh-closeout
