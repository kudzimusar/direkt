name: RC9 generated-client claim reconciler

on:
  pull_request:
    paths:
      - ".github/workflows/rc9-claim-reconcile.yml"
      - "scripts/rc9/patch-claim-generated-clients.py"
      - "scripts/rc9/patch-rc7-forward-compatible-closure.py"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'integration/rc9-generated-clients'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/rc9-generated-clients
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply and validate the bounded RC9 claim
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rc9/patch-claim-generated-clients.py
          python3 scripts/rc9/patch-rc7-forward-compatible-closure.py
          python3 scripts/rc9/verify-generated-client-contract.py
          python3 scripts/rc8/verify-payments-contract.py
          python3 scripts/rc7/verify-maps-contract.py
          python3 scripts/rc6/verify-whatsapp-contract.py
          python3 scripts/rc5/verify-test-lab-closure.py
          python3 -m py_compile \
            scripts/rc9/verify-generated-client-contract.py \
            scripts/rc8/verify-payments-contract.py \
            scripts/rc7/verify-maps-contract.py \
            scripts/rc6/verify-whatsapp-contract.py \
            scripts/rc5/verify-test-lab-closure.py
          sed -i 's/[[:space:]]\+$//' \
            WORKSTREAM_LOCK.md \
            PROJECT_STATUS.md \
            docs/integrations/CURRENT_INTEGRATION_STATUS.md \
            docs/integrations/LIVE_INTEGRATION_LEDGER.md
          rm \
            scripts/rc9/patch-claim-generated-clients.py \
            scripts/rc9/patch-rc7-forward-compatible-closure.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            WORKSTREAM_LOCK.md \
            PROJECT_STATUS.md \
            docs/integrations/CURRENT_INTEGRATION_STATUS.md \
            docs/integrations/LIVE_INTEGRATION_LEDGER.md \
            scripts/rc7/verify-maps-contract.py \
            scripts/rc9/patch-claim-generated-clients.py \
            scripts/rc9/patch-rc7-forward-compatible-closure.py
          git diff --cached --check
          git commit -m 'chore(rc9): claim generated-client adoption lane'
          git push origin HEAD:integration/rc9-generated-clients
