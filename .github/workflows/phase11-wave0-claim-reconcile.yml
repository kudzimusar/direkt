name: Phase 11 Wave 0 claim reconciler

on:
  pull_request:
    paths:
      - ".github/workflows/phase11-wave0-claim-reconcile.yml"
      - "scripts/phase11/patch-wave0-claim.py"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'phase11/wave0-finishing-line'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase11/wave0-finishing-line
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply and verify Wave 0 claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/phase11/patch-wave0-claim.py
          python3 scripts/rc11/verify-final-integration-closure.py
          python3 scripts/phase11/verify-primary-pilot-readiness.py
          rm scripts/phase11/patch-wave0-claim.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add WORKSTREAM_LOCK.md PROJECT_STATUS.md scripts/phase11/patch-wave0-claim.py
          git diff --cached --check
          git commit -m 'docs(phase11): claim Wave 0 finishing-line reconciliation'
          git push origin HEAD:phase11/wave0-finishing-line
