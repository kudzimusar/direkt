name: RC7 closure reconcile log

on:
  pull_request:
    paths:
      - ".github/workflows/rc7-closure-log.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'close/rc7-google-maps-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_JOB_ID: "89881404718"
    steps:
      - name: Print bounded RC7 closure failure
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/job.log"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" > "${raw}"
          grep -E 'RC7_CLOSURE_FAILED_STAGE|AssertionError|Traceback|expected one occurrence|Missing |Prohibited |Process completed with exit code' "${raw}" | tail -n 100 || true
