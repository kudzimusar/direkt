name: RC7 deterministic APK certificate reconciler

on:
  pull_request:
    paths:
      - ".github/workflows/rc7-deterministic-apk-reconcile.yml"
      - "scripts/rc7/patch-deterministic-apk-certificate.py"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/rc7-deterministic-apk-certificate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/rc7-deterministic-apk-certificate
          fetch-depth: 0
      - name: Apply and validate permanent RC7 certificate correction
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/rc7/patch-deterministic-apk-certificate.py ]]; then
            echo 'RC7 deterministic certificate source already reconciled.'
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/rc7/patch-deterministic-apk-certificate.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('old_ledger = ')
          end = text.index('\nnew_ledger =', start)
          live = '| Google Maps Platform | `IMPLEMENTED_GATED / CORRECTIVE MANAGED PROOF IN PROGRESS` | RC7 keeps the restricted Android key, Maps Compose latch, bounded Zambia normalization, privacy-safe rendering and manual/list fallback. Backend Geocoding uses v4 service-identity OAuth; backend keys, Maps secrets, Direct VPC egress and Cloud NAT are prohibited. Run `30210742617/1` exposed the billing-account boundary and was corrected without granting CI billing IAM. Run `30225624823/1` exposed ranked-result selection and was corrected. Exact-main run `30226241329/1` then passed the backend Geocoding v4 OAuth canary and all budget/quota/key/image controls, but one API 36 instrumentation test failed in matrix `matrix-3gndt2ks91n33`. Artifact `8638705116`, digest `sha256:49fbc387d06eeb7061ca1c8923a313c8dff22f534e2940398f7d4df26d55233c`; backend PASS and Cloud Run Job cleanup passed. The next proof verifies the final APK signing certificate against the restricted Android key and emits only bounded Tool Results test-case evidence; fallback remains a failure. |'
          text = text[:start] + f'old_ledger = {live!r}' + text[end:]
          text = text.replace("        '\"certificateFormatValid\"',", '        "certificateFormatValid:",')
          text = text.replace("        '\"rawStderrIncluded\"',", '        "rawStderrIncluded:",')
          path.write_text(text, encoding='utf-8')
          PY

          run_stage() {
            local label="$1"
            shift
            local output="${RUNNER_TEMP}/${label}.log"
            set +e
            "$@" >"${output}" 2>&1
            local code=$?
            set -e
            if [[ "${code}" -ne 0 ]]; then
              echo "RC7_RECONCILE_FAILED_STAGE=${label}"
              tail -n 80 "${output}"
              exit "${code}"
            fi
          }

          run_stage patch python3 scripts/rc7/patch-deterministic-apk-certificate.py
          run_stage shell bash -n scripts/rc7/run-maps-managed.sh
          run_stage contract python3 scripts/rc7/verify-maps-contract.py
          run_stage context python3 scripts/rc7/verify-managed-workflow-context.py
          run_stage collector python3 -m py_compile scripts/rc7/collect-testlab-failure.py

          rm scripts/rc7/patch-deterministic-apk-certificate.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/rc7/run-maps-managed.sh \
            scripts/rc7/verify-maps-contract.py \
            scripts/rc7/verify-managed-workflow-context.py \
            docs/integrations/CURRENT_INTEGRATION_STATUS.md \
            docs/integrations/LIVE_INTEGRATION_LEDGER.md \
            docs/integrations/RC7_GOOGLE_MAPS_IMPLEMENTATION_NOTES.md \
            scripts/rc7/patch-deterministic-apk-certificate.py
          git diff --cached --check
          git commit -m 'fix(rc7): make APK certificate proof deterministic'
          git push origin HEAD:fix/rc7-deterministic-apk-certificate
