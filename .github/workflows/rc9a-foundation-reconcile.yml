name: RC9A deterministic foundation reconciler

on:
  pull_request:
    paths:
      - ".github/workflows/rc9a-foundation-reconcile.yml"
      - "scripts/rc9/patch-rc9a-foundation-status.py"
      - "scripts/rc9/generate-clients.sh"
      - "clients/generator/**"
      - "clients/generated/kotlin/build.gradle.kts"
      - "clients/generated/kotlin/settings.gradle.kts"
      - "clients/generated/typescript/tsconfig.json"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/rc9a-deterministic-generated-clients'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/rc9a-deterministic-generated-clients
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/direkt-api/package-lock.json
            web/direkt-app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate, compile and publish deterministic source
        shell: bash
        run: |
          set -euo pipefail
          pushd backend/direkt-api >/dev/null
          npm ci --ignore-scripts
          npm run openapi:check
          popd >/dev/null

          bash scripts/rc9/generate-clients.sh --write
          test "$(find clients/generated/kotlin/src/main/kotlin -type f -name '*.kt' | wc -l | tr -d ' ')" -ge 50
          test "$(find clients/generated/typescript/src -type f -name '*.ts' | wc -l | tr -d ' ')" -ge 50

          chmod +x android/direkt-app/gradlew
          android/direkt-app/gradlew \
            --project-dir clients/generated/kotlin \
            --no-daemon \
            --stacktrace \
            clean compileKotlin
          if ! find clients/generated/kotlin/build/classes/kotlin/main -type f -name '*.class' -print -quit | grep -q .; then
            echo 'RC9A Kotlin compile produced no class files.' >&2
            exit 1
          fi

          pushd web/direkt-app >/dev/null
          npm ci --ignore-scripts
          ./node_modules/.bin/tsc \
            --project ../../clients/generated/typescript/tsconfig.json \
            --noEmit
          popd >/dev/null

          python3 scripts/rc9/patch-rc9a-foundation-status.py
          python3 scripts/rc9/verify-generated-foundation.py
          python3 scripts/rc9/verify-generated-client-contract.py
          python3 scripts/rc8/verify-payments-contract.py
          python3 scripts/rc7/verify-maps-contract.py
          python3 scripts/rc6/verify-whatsapp-contract.py
          python3 scripts/rc5/verify-test-lab-closure.py
          python3 -m py_compile \
            scripts/rc9/verify-generated-foundation.py \
            scripts/rc9/verify-generated-client-contract.py \
            scripts/rc8/verify-payments-contract.py \
            scripts/rc7/verify-maps-contract.py \
            scripts/rc6/verify-whatsapp-contract.py \
            scripts/rc5/verify-test-lab-closure.py

          bash scripts/rc9/generate-clients.sh --check

          sed -i 's/[[:space:]]\+$//' \
            WORKSTREAM_LOCK.md \
            PROJECT_STATUS.md \
            docs/integrations/CURRENT_INTEGRATION_STATUS.md \
            docs/integrations/LIVE_INTEGRATION_LEDGER.md \
            docs/integrations/RC9_GENERATED_CLIENTS_IMPLEMENTATION.md
          rm scripts/rc9/patch-rc9a-foundation-status.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            clients/generated/kotlin/src \
            clients/generated/typescript/src \
            clients/generated/GENERATION_RECEIPT.json \
            scripts/rc9/generate-clients.sh \
            WORKSTREAM_LOCK.md \
            PROJECT_STATUS.md \
            docs/integrations/CURRENT_INTEGRATION_STATUS.md \
            docs/integrations/LIVE_INTEGRATION_LEDGER.md \
            docs/integrations/RC9_GENERATED_CLIENTS_IMPLEMENTATION.md \
            scripts/rc9/patch-rc9a-foundation-status.py
          git diff --cached --check
          git commit -m 'feat(rc9a): generate deterministic Kotlin and TypeScript clients'
          git push origin HEAD:feat/rc9a-deterministic-generated-clients
