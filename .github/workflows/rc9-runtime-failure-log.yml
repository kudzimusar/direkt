name: RC9 runtime adoption failure log

on:
  pull_request:
    paths:
      - ".github/workflows/rc9-runtime-failure-log.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/rc9-generated-client-runtime-adoption'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_JOB_ID: "89975309533"
    steps:
      - name: Print bounded runtime failure
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/rc9-runtime.log"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" > "${raw}"
          tail -n 180 "${raw}"
