name: RC9A generated template receipt

on:
  pull_request:
    paths:
      - ".github/workflows/rc9a-template-receipt.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/rc9a-deterministic-generated-clients'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_JOB_ID: "89923494047"
    steps:
      - name: Print bounded generated metadata
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/rc9a-template.log"
          clean="${RUNNER_TEMP}/rc9a-template-clean.log"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" > "${raw}"
          sed -r 's/\x1B\[[0-9;]*[mK]//g; s/^.*Z //' "${raw}" > "${clean}"
          awk '/=== KOTLIN BUILD FILES ===/{capture=1} capture{print} /=== TYPESCRIPT IMPORTS ===/{imports=1; next} imports && ++count>=170{exit}' "${clean}" | tail -n 320
