name: UIA current-main refresh claim publisher

on:
  pull_request:
    paths:
      - ".github/workflows/uia-current-main-refresh-claim-reconcile.yml"
      - "scripts/uia/claim-current-main-refresh.py"

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/uia-current-main-refresh-claim'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/uia-current-main-refresh-claim
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Publish UIA refresh claim
        run: |
          set -euo pipefail
          python3 scripts/uia/claim-current-main-refresh.py
          grep -Fq 'CLAIMED — UIA EXACT-CURRENT-MAIN OWNER-REVIEW REFRESH' WORKSTREAM_LOCK.md
          grep -Fq 'PILOT_ENTRY_APPROVED` remains false' WORKSTREAM_LOCK.md
          python3 scripts/rc11/verify-final-integration-closure.py
          python3 scripts/phase11/verify-primary-pilot-readiness.py
          python3 scripts/phase11/evaluate-wave0-gates.py
          python3 scripts/phase11/verify-wave0-finishing-line.py
          rm scripts/uia/claim-current-main-refresh.py
          rm .github/workflows/uia-current-main-refresh-claim-reconcile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add WORKSTREAM_LOCK.md scripts/uia/claim-current-main-refresh.py .github/workflows/uia-current-main-refresh-claim-reconcile.yml
          git diff --cached --check
          git commit -m 'chore(uia): claim exact-current-main owner-review refresh'
          git push origin HEAD:chore/uia-current-main-refresh-claim
