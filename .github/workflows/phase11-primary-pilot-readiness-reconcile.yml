name: Phase 11 primary-pilot readiness publisher

on:
  pull_request:
    paths:
      - ".github/workflows/phase11-primary-pilot-readiness-reconcile.yml"
      - "scripts/phase11/patch-primary-pilot-readiness.py"
      - "scripts/phase11/verify-primary-pilot-readiness.py"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'phase11/primary-pilot-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase11/primary-pilot-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply and verify Phase 11 readiness package
        run: |
          set -euo pipefail
          python3 scripts/phase11/patch-primary-pilot-readiness.py
          python3 scripts/rc11/verify-final-integration-closure.py
          python3 scripts/phase11/verify-primary-pilot-readiness.py
          rm scripts/phase11/patch-primary-pilot-readiness.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add WORKSTREAM_LOCK.md PROJECT_STATUS.md docs/phase11/PHASE11_EXECUTION_AND_ENTRY_CONTROL.md scripts/phase11/patch-primary-pilot-readiness.py
          git diff --cached --check
          git commit -m 'docs(phase11): operationalize primary-pilot readiness'
          git push origin HEAD:phase11/primary-pilot-readiness
