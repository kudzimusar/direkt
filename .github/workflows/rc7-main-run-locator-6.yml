name: RC7 exact-main run locator 6

on:
  pull_request:
    paths:
      - ".github/workflows/rc7-main-run-locator-6.yml"

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  locate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/rc7-main-run-locator-6'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXACT_MAIN_SHA: 28481cd2d83a32259bd5b30784afefd575a51c58
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Locate and await exact-main RC7 workflow run
        shell: bash
        run: |
          set -euo pipefail
          run_json=""
          for _ in $(seq 1 100); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/rc7-maps-managed.yml/runs?branch=main&event=push&per_page=30")"
            run_json="$(jq -c --arg sha "${EXACT_MAIN_SHA}" '[.workflow_runs[] | select(.head_sha == $sha)][0] // empty' <<< "${runs}")"
            if [[ -n "${run_json}" ]]; then
              break
            fi
            sleep 10
          done
          test -n "${run_json}"
          run_id="$(jq -r '.id' <<< "${run_json}")"
          for _ in $(seq 1 120); do
            run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            if [[ "$(jq -r '.status' <<< "${run_json}")" == "completed" ]]; then
              break
            fi
            sleep 10
          done
          test "$(jq -r '.status' <<< "${run_json}")" = "completed"
          jobs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          artifacts="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          body="${RUNNER_TEMP}/rc7-locator.md"
          {
            echo '## RC7 exact-main workflow locator 6'
            echo
            echo "- Exact main: \`${EXACT_MAIN_SHA}\`"
            echo
            echo '### Run'
            echo '```json'
            jq '{id, run_number, run_attempt, status, conclusion, html_url, head_sha, event, created_at, updated_at}' <<< "${run_json}"
            echo '```'
            echo
            echo '### Jobs'
            echo '```json'
            jq '[.jobs[] | {id, name, status, conclusion, started_at, completed_at}]' <<< "${jobs}"
            echo '```'
            echo
            echo '### Artifacts'
            echo '```json'
            jq '[.artifacts[] | {id, name, size_in_bytes, expired, created_at, updated_at, digest}]' <<< "${artifacts}"
            echo '```'
          } > "${body}"
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${GITHUB_REPOSITORY}" --body-file "${body}"
