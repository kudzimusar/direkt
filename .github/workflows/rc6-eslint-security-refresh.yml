name: DIREKT temporary RC6 ESLint security lock refresh

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rc6-eslint-security-refresh.yml

permissions:
  contents: write

concurrency:
  group: direkt-rc6-eslint-security-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Resolve patched ESLint graph and remove temporary workflow
    if: >-
      github.repository == 'kudzimusar/direkt' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/rc6-whatsapp-run-bridge-8fe357e'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIAGNOSTICS_DIR: ${{ github.workspace }}/artifacts/rc6-eslint-refresh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/direkt-api/package-lock.json

      - name: Initialize sanitized diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${DIAGNOSTICS_DIR}"
          {
            echo "WORKFLOW_SHA=${GITHUB_SHA}"
            echo "PR_HEAD=${{ github.event.pull_request.head.sha }}"
            echo "MODE=development_toolchain_security_refresh"
            echo "SECRET_VALUES_ACCESSED=false"
            echo "PRODUCTION_AUTHORIZATION=false"
          } > "${DIAGNOSTICS_DIR}/summary.txt"

      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "${EXPECTED_BRANCH}" = "integration/rc6-whatsapp-run-bridge-8fe357e"
          remote_head="$(git ls-remote origin "refs/heads/${EXPECTED_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${EXPECTED_HEAD}"
          echo "PASS=exact_pr_head" >> "${DIAGNOSTICS_DIR}/summary.txt"

      - name: Record Node and bundled npm versions
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "NODE_VERSION=$(node --version)"
            echo "BUNDLED_NPM_VERSION=$(npm --version)"
            echo "PASS=runner_tool_versions"
          } >> "${DIAGNOSTICS_DIR}/summary.txt"

      - name: Verify repository npm CLI pin is published
        shell: bash
        working-directory: backend/direkt-api
        run: |
          set -euo pipefail
          npm_pin="$(npm view npm@11.16.0 version)"
          echo "NPM_PIN_RESULT=${npm_pin}" >> "${DIAGNOSTICS_DIR}/summary.txt"
          test "${npm_pin}" = "11.16.0"
          echo "PASS=npm_pin_published" >> "${DIAGNOSTICS_DIR}/summary.txt"

      - name: Install repository npm CLI pin
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.16.0
          echo "ACTIVE_NPM_VERSION=$(npm --version)" >> "${DIAGNOSTICS_DIR}/summary.txt"
          test "$(npm --version)" = "11.16.0"
          echo "PASS=npm_pin_active" >> "${DIAGNOSTICS_DIR}/summary.txt"

      - name: Verify published security targets
        shell: bash
        working-directory: backend/direkt-api
        run: |
          set -euo pipefail
          eslint_version="$(npm view eslint@10.8.0 version)"
          eslint_js_version="$(npm view @eslint/js@10.0.1 version)"
          test "${eslint_version}" = "10.8.0"
          test "${eslint_js_version}" = "10.0.1"
          {
            echo "ESLINT_TARGET=${eslint_version}"
            echo "ESLINT_JS_TARGET=${eslint_js_version}"
            echo "PASS=security_targets_published"
          } >> "${DIAGNOSTICS_DIR}/summary.txt"

      - name: Resolve patched package and lock graph
        shell: bash
        working-directory: backend/direkt-api
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact eslint@10.8.0 @eslint/js@10.0.1
          npm ls eslint @eslint/js brace-expansion minimatch --all --json > "${DIAGNOSTICS_DIR}/resolved-tree.json"
          echo "PASS=dependency_resolution" >> "${DIAGNOSTICS_DIR}/summary.txt"

      - name: Audit patched backend graph
        shell: bash
        working-directory: backend/direkt-api
        run: |
          set -euo pipefail
          npm audit --json > "${DIAGNOSTICS_DIR}/npm-audit.json"
          echo "PASS=npm_audit" >> "${DIAGNOSTICS_DIR}/summary.txt"

      - name: Apply ESLint 10 dead-assignment cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/direkt-api/src/discovery/discovery.repository.ts')
          text = path.read_text(encoding='utf-8')
          before = """    let originExpression = 'NULL::geography';
              let areaMatchExpression = 'false';
              let distanceExpression = 'NULL::double precision';
              if (dto.latitude !== undefined && dto.longitude !== undefined) {
                const longitudeParameter = parameter(dto.longitude);
                const latitudeParameter = parameter(dto.latitude);
                originExpression = `ST_SetSRID(ST_MakePoint(${longitudeParameter}, ${latitudeParameter}), 4326)::geography`;
          """
          after = """    let areaMatchExpression = 'false';
              let distanceExpression = 'NULL::double precision';
              if (dto.latitude !== undefined && dto.longitude !== undefined) {
                const longitudeParameter = parameter(dto.longitude);
                const latitudeParameter = parameter(dto.latitude);
                const originExpression = `ST_SetSRID(ST_MakePoint(${longitudeParameter}, ${latitudeParameter}), 4326)::geography`;
          """
          if text.count(before) != 1:
              raise SystemExit('Expected exactly one discovery origin-expression pattern.')
          path.write_text(text.replace(before, after), encoding='utf-8')
          PY
          git diff --check -- backend/direkt-api/src/discovery/discovery.repository.ts
          echo "PASS=no_useless_assignment_cleanup" >> "${DIAGNOSTICS_DIR}/summary.txt"

      - name: Verify formatting
        shell: bash
        working-directory: backend/direkt-api
        run: |
          set -euo pipefail
          npm run format:check
          echo "PASS=format_check" >> "${DIAGNOSTICS_DIR}/summary.txt"

      - name: Verify ESLint 10 compatibility
        shell: bash
        working-directory: backend/direkt-api
        run: |
          set -euo pipefail
          npm run lint
          echo "PASS=lint" >> "${DIAGNOSTICS_DIR}/summary.txt"

      - name: Verify backend types
        shell: bash
        working-directory: backend/direkt-api
        run: |
          set -euo pipefail
          npm run typecheck
          echo "PASS=typecheck" >> "${DIAGNOSTICS_DIR}/summary.txt"

      - name: Verify backend build
        shell: bash
        working-directory: backend/direkt-api
        run: |
          set -euo pipefail
          npm run build
          echo "PASS=build" >> "${DIAGNOSTICS_DIR}/summary.txt"

      - name: Upload sanitized dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-eslint-security-refresh-${{ github.run_id }}
          path: artifacts/rc6-eslint-refresh
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified security refresh and self-remove
        shell: bash
        env:
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git rm .github/workflows/rc6-eslint-security-refresh.yml
          if [[ -f .github/workflows/rc6-eslint-lint-diagnostic.yml ]]; then
            git rm .github/workflows/rc6-eslint-lint-diagnostic.yml
          fi
          git diff --check
          git diff --exit-code -- backend/direkt-api/package.json backend/direkt-api/package-lock.json && {
            echo "::error title=No dependency refresh produced::Expected patched package and lockfile changes."
            exit 1
          }
          git diff --exit-code -- backend/direkt-api/src/discovery/discovery.repository.ts && {
            echo "::error title=No lint cleanup produced::Expected the verified dead-assignment cleanup."
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/direkt-api/package.json \
            backend/direkt-api/package-lock.json \
            backend/direkt-api/src/discovery/discovery.repository.ts
          git commit -m "fix(security): update backend ESLint toolchain"
          git push origin "HEAD:${EXPECTED_BRANCH}"
