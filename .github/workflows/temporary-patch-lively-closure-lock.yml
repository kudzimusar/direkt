name: Temporary Lively closure lock patch

on:
  push:
    branches:
      - chore/lively-marketplace-closure
    paths:
      - ".github/workflows/temporary-patch-lively-closure-lock.yml"

permissions:
  contents: write

jobs:
  patch-and-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/lively-marketplace-closure
          fetch-depth: 0
      - name: Preserve Wave 0 historical baseline marker and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lock = Path("WORKSTREAM_LOCK.md")
          text = lock.read_text(encoding="utf-8")
          marker = "Historical Wave 0 contract marker: Stable baseline | `main@632dd0bdbb2a3b8c24bd285918deff3e54bd3ba9`"
          anchor = "## W8 historical closure receipt — CLOSED AND PRESERVED"
          if marker not in text:
              text = text.replace(anchor, marker + "\n\n" + anchor, 1)
              lock.write_text(text, encoding="utf-8")
          Path(".github/workflows/temporary-patch-lively-closure-lock.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WORKSTREAM_LOCK.md .github/workflows/temporary-patch-lively-closure-lock.yml
          git commit -m "docs(ui): preserve Wave 0 historical lock marker"
          git push origin HEAD:chore/lively-marketplace-closure
