name: RC9 regression failure log

on:
  pull_request:
    paths:
      - ".github/workflows/rc9-regression-failure-log.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/rc9-generated-client-runtime-adoption'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_JOB_ID: "89998676940"
    steps:
      - name: Print Phase 12B validation failure
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/phase12b.log"
          clean="${RUNNER_TEMP}/phase12b-clean.log"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" > "${raw}"
          sed -r 's/\x1B\[[0-9;]*[mK]//g; s/^.*Z //' "${raw}" > "${clean}"
          tail -n 90 "${clean}"
