name: DIREKT RC5 branch-only closure builder

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rc5-closure-source-builder.yml

permissions:
  contents: read

concurrency:
  group: direkt-rc5-closure-builder-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    name: Generate and verify RC5 closure tree
    if: github.repository == 'kudzimusar/direkt' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/rc5-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/rc5-closure
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Require branch-only execution
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "docs/rc5-closure"
          test "$(git branch --show-current)" = "docs/rc5-closure"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "c3744430a7beb1cd47246d858df9ac1379a068ac"
      - name: Apply deterministic RC5 closure reconciliation
        shell: bash
        run: GITHUB_REF=refs/heads/docs/rc5-closure python3 scripts/rc5/apply-rc5-closure.py
      - name: Verify generated closure source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rc5/verify-test-lab-closure.py
          ruby -e 'require "yaml"; YAML.safe_load(File.read(".github/workflows/firebase-test-lab-isolated.yml"), aliases: true); YAML.safe_load(File.read(".github/workflows/rc5-test-lab-isolated-contract.yml"), aliases: true); YAML.safe_load(File.read(".github/workflows/rc5-test-lab-closure-contract.yml"), aliases: true)'
          bash -n scripts/rc5/run-test-lab-isolated-managed.sh
          bash -n scripts/rc5/run-test-lab-isolated-preflight.sh
          test ! -e .github/workflows/rc5-closure-source-builder.yml
          test ! -e scripts/rc5/apply-rc5-closure.py
      - name: Package generated closure tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rc5-closure-tree"
          cp --parents \
            WORKSTREAM_LOCK.md \
            PROJECT_STATUS.md \
            docs/integrations/CURRENT_INTEGRATION_STATUS.md \
            docs/integrations/LIVE_INTEGRATION_LEDGER.md \
            docs/integrations/RC5_ISOLATED_TEST_LAB.md \
            scripts/rc5/verify-test-lab-closure.py \
            .github/workflows/rc5-test-lab-closure-contract.yml \
            "${RUNNER_TEMP}/rc5-closure-tree/"
          git diff --binary > "${RUNNER_TEMP}/rc5-closure-tree/rc5-closure.patch"
          git diff --name-status > "${RUNNER_TEMP}/rc5-closure-tree/rc5-closure-name-status.txt"
      - name: Upload verified generated closure tree
        uses: actions/upload-artifact@v4
        with:
          name: rc5-generated-closure-tree-${{ github.run_id }}
          path: ${{ runner.temp }}/rc5-closure-tree
          if-no-files-found: error
          retention-days: 7
