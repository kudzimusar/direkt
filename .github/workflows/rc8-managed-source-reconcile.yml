name: RC8 managed source reconciler

on:
  pull_request:
    paths:
      - ".github/workflows/rc8-managed-source-reconcile.yml"
      - "scripts/rc8/patch-managed-proof-source.py"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/rc8-managed-sandbox-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/rc8-managed-sandbox-proof
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/direkt-api/package-lock.json
      - name: Reconcile and validate managed RC8 source
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          if [[ ! -f scripts/rc8/patch-managed-proof-source.py ]]; then
            echo 'RC8 managed source already reconciled.'
            exit 0
          fi
          python3 scripts/rc8/patch-managed-proof-source.py
          pushd backend/direkt-api >/dev/null
          npm ci --ignore-scripts
          npx prettier --write src/commercial/rc8-payment-canary.ts package.json
          npm run format:check
          npm run lint
          npm run typecheck
          npx vitest run \
            test/unit/rc8-sandbox-payment-provider.spec.ts \
            test/unit/mtn-momo-sandbox-payment-provider.adapter.spec.ts \
            test/unit/stripe-sandbox-payment-provider.adapter.spec.ts \
            test/unit/paypal-sandbox-payment-provider.adapter.spec.ts \
            test/unit/dpo-sandbox-payment-provider.adapter.spec.ts \
            test/unit/sandbox-payment-reconciliation.spec.ts
          npm run build
          popd >/dev/null
          python3 scripts/rc8/verify-payments-contract.py
          python3 scripts/rc5/verify-test-lab-closure.py
          python3 scripts/rc6/verify-whatsapp-contract.py
          python3 scripts/rc7/verify-maps-contract.py
          python3 -m py_compile \
            scripts/rc8/verify-payments-contract.py \
            scripts/rc5/verify-test-lab-closure.py \
            scripts/rc6/verify-whatsapp-contract.py \
            scripts/rc7/verify-maps-contract.py
          bash -n scripts/rc8/run-payments-managed.sh
          bash -n scripts/rc8/bootstrap-payments-managed.sh
          sed -i 's/[[:space:]]\+$//' \
            WORKSTREAM_LOCK.md \
            PROJECT_STATUS.md \
            docs/integrations/CURRENT_INTEGRATION_STATUS.md \
            docs/integrations/LIVE_INTEGRATION_LEDGER.md \
            docs/integrations/RC8_SANDBOX_PAYMENTS_IMPLEMENTATION.md \
            docs/integrations/RC8_PAYMENTS_MANAGED_TRIGGER.md
          rm scripts/rc8/patch-managed-proof-source.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/rc8-payments-managed.yml \
            WORKSTREAM_LOCK.md \
            PROJECT_STATUS.md \
            backend/direkt-api/package.json \
            backend/direkt-api/src/commercial/rc8-payment-canary.ts \
            docs/integrations/CURRENT_INTEGRATION_STATUS.md \
            docs/integrations/LIVE_INTEGRATION_LEDGER.md \
            docs/integrations/RC8_PAYMENTS_MANAGED_TRIGGER.md \
            docs/integrations/RC8_SANDBOX_PAYMENTS_IMPLEMENTATION.md \
            scripts/rc8/bootstrap-payments-managed.sh \
            scripts/rc8/run-payments-managed.sh \
            scripts/rc8/verify-payments-contract.py \
            scripts/rc8/patch-managed-proof-source.py
          git diff --cached --check
          git commit -m 'feat(rc8): arm private managed sandbox payment proof'
          git push origin HEAD:feat/rc8-managed-sandbox-proof
