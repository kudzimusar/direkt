name: DIREKT RC7 managed Google Maps proof

on:
  pull_request:
    paths:
      - ".github/workflows/rc7-maps-managed.yml"
      - "scripts/rc7/run-maps-managed.sh"
      - "scripts/rc7/bootstrap-maps-managed.sh"
      - "scripts/rc7/verify-maps-contract.py"
      - "scripts/rc7/verify-managed-workflow-context.py"
      - "backend/direkt-api/src/location/**"
      - "backend/direkt-api/src/config/environment.ts"
      - "backend/direkt-api/test/unit/location/**"
      - "backend/direkt-api/test/unit/config/environment-maps.spec.ts"
      - "android/direkt-app/app/src/androidTest/java/com/kudzimusar/direkt/Rc7MapsRuntimeTest.kt"
      - "docs/integrations/RC7_MAPS_MANAGED_TRIGGER.md"
      - "docs/integrations/RC7_MAPS_OWNER_BOOTSTRAP.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rc7-maps-managed.yml"
      - "scripts/rc7/run-maps-managed.sh"
      - "scripts/rc7/bootstrap-maps-managed.sh"
      - "scripts/rc7/verify-maps-contract.py"
      - "scripts/rc7/verify-managed-workflow-context.py"
      - "backend/direkt-api/src/location/**"
      - "backend/direkt-api/src/config/environment.ts"
      - "backend/direkt-api/test/unit/location/**"
      - "backend/direkt-api/test/unit/config/environment-maps.spec.ts"
      - "android/direkt-app/app/src/androidTest/java/com/kudzimusar/direkt/Rc7MapsRuntimeTest.kt"
      - "docs/integrations/RC7_MAPS_MANAGED_TRIGGER.md"
      - "docs/integrations/RC7_MAPS_OWNER_BOOTSTRAP.md"
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN-DIREKT-RC7-MAPS-MANAGED
        required: true
        type: string
      source_sha:
        description: Exact reviewed commit that must equal current main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: direkt-rc7-maps-managed
  cancel-in-progress: false

jobs:
  contract:
    name: Verify managed Maps workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify permanent RC7 source and managed controls
        run: |
          python3 scripts/rc7/verify-maps-contract.py
          python3 scripts/rc7/verify-managed-workflow-context.py
          bash -n scripts/rc7/run-maps-managed.sh
          bash -n scripts/rc7/bootstrap-maps-managed.sh
          grep -Fq 'RC7_MAPS_BOOTSTRAP|PASS' scripts/rc7/bootstrap-maps-managed.sh
          grep -Fq 'RUN-DIREKT-RC7-MAPS-MANAGED' docs/integrations/RC7_MAPS_MANAGED_TRIGGER.md
          grep -Fq 'DIREKT RC7 managed Google Maps proof' .github/workflows/rc7-maps-managed.yml

  managed:
    name: Prove privacy-safe Maps runtime
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: staging
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      GCP_PROJECT_ID: direkt-dev-502701
      GCP_PROJECT_NUMBER: "264358173369"
      GCP_REGION: asia-northeast1
      GCP_ARTIFACT_REGISTRY: direkt-containers
      GCP_RUNTIME_SERVICE_ACCOUNT: direkt-api-runtime@direkt-dev-502701.iam.gserviceaccount.com
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/264358173369/locations/global/workloadIdentityPools/direkt-github/providers/direkt-main
      GCP_DEPLOYER_SERVICE_ACCOUNT: direkt-github-deployer@direkt-dev-502701.iam.gserviceaccount.com
      TESTLAB_PROJECT_ID: direkt-testlab-502701-20260726
      DIREKT_GRADLE_VERSION: "9.4.0"
      DIREKT_GCLOUD_VERSION: "568.0.0"
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    steps:
      - name: Resolve exact-main execution inputs
        id: controls
        shell: bash
        env:
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]]; then
            test "${DISPATCH_CONFIRMATION}" = "RUN-DIREKT-RC7-MAPS-MANAGED"
            [[ "${DISPATCH_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
            echo "source_sha=${DISPATCH_SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          else
            echo "source_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          fi
          echo "RC7_RECEIPT_PATH=${RUNNER_TEMP}/rc7-maps-managed-receipt.txt" >> "${GITHUB_ENV}"

      - name: Check out exact reviewed source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.controls.outputs.source_sha }}
          fetch-depth: 0

      - name: Verify exact source equals current main and trigger is armed
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.controls.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "${SOURCE_SHA}"
          grep -Fxq 'STATUS=ARMED' docs/integrations/RC7_MAPS_MANAGED_TRIGGER.md
          grep -Fxq 'CONFIRMATION=RUN-DIREKT-RC7-MAPS-MANAGED' docs/integrations/RC7_MAPS_MANAGED_TRIGGER.md
          python3 scripts/rc7/verify-maps-contract.py
          python3 scripts/rc7/verify-managed-workflow-context.py
          bash -n scripts/rc7/run-maps-managed.sh
          bash -n scripts/rc7/bootstrap-maps-managed.sh
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "${GITHUB_ENV}"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.DIREKT_GRADLE_VERSION }}

      - name: Authenticate through existing GitHub WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ${{ env.DIREKT_GCLOUD_VERSION }}

      - name: Install matching gcloud alpha component noninteractively
        shell: bash
        run: gcloud components install alpha --quiet

      - name: Execute bounded managed proof
        shell: bash
        run: bash scripts/rc7/run-maps-managed.sh

      - name: Upload sanitized RC7 managed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc7-maps-managed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rc7-maps-managed-receipt.txt
            ${{ runner.temp }}/rc7-android-key-metadata.json
            ${{ runner.temp }}/rc7-geocoding-quota.json
            ${{ runner.temp }}/rc7-maps-budget.json
            ${{ runner.temp }}/rc7-maps-execution.json
            ${{ runner.temp }}/rc7-maps-canary-failure.json
            ${{ runner.temp }}/rc7-maps-test-lab.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish managed proof summary
        if: always()
        shell: bash
        run: |
          {
            echo '### DIREKT RC7 managed Google Maps proof'
            echo "- Exact current main: \`${SOURCE_SHA:-not-resolved}\`"
            echo '- Owner bootstrap: budget/quota and time-limited least-privilege IAM only'
            echo '- Android key: package + SHA-1 restricted; Maps SDK for Android only'
            echo '- Backend auth: Cloud Run user-managed service identity with downscoped Geocoding v4 OAuth'
            echo '- Backend API key / secret / Cloud NAT: not used'
            echo '- Android proof: one API 36 Firebase Test Lab instrumentation run, zero flaky retries'
            echo '- Places / Routes: not enabled by RC7'
            echo '- Private provider coordinates: not published or logged'
            echo '- Participant / production authorization: false'
            echo '- Temporary Cloud Run Job: cleanup enforced'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish sanitized terminal receipt to Issue 261
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="FAILED"
          if [[ -f "${RC7_RECEIPT_PATH}" ]] && grep -Fxq 'managed_result=PASS' "${RC7_RECEIPT_PATH}"; then
            result="PASS"
          fi
          source_sha="${SOURCE_SHA:-${{ steps.controls.outputs.source_sha }}}"
          body="${RUNNER_TEMP}/rc7-issue-receipt.md"
          {
            echo '## RC7 managed Google Maps proof receipt'
            echo
            echo "- Result: **${result}**"
            echo "- Exact current main: \`${source_sha:-not-resolved}\`"
            echo "- Managed run: [${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo '- Owner bootstrap: budget/quota plus temporary least-privilege IAM; no backend credential value'
            echo '- Android credential: debug package + signing SHA-1 restricted; Maps SDK for Android only'
            echo '- Backend authentication: user-managed Cloud Run service identity + downscoped Geocoding v4 OAuth'
            echo '- Backend API key / Secret Manager value / Cloud NAT: absent'
            echo '- Places / Routes: not enabled by RC7'
            echo '- Private provider coordinates published or logged: false'
            echo '- Participant / production authorization: false'
            echo '- Temporary Cloud Run Job cleanup: enforced'
            if [[ -f "${RC7_RECEIPT_PATH}" ]]; then
              grep -E '^(owner_bootstrap_verified|backend_authentication|backend_oauth_scope|backend_api_key_present|backend_secret_value_present|backend_cloud_nat_used|backend_geocoding_canary|backend_service_identity_oauth_proven|android_test_lab_map_ready|budget_alert_present|geocoding_quota_per_minute|cleanup\.|cleanup_failed|managed_result)=' "${RC7_RECEIPT_PATH}" | sed 's/^/- `/' | sed 's/$/`/' || true
            fi
          } > "${body}"
          gh issue comment 261 --repo "${GITHUB_REPOSITORY}" --body-file "${body}"
