name: Phase 11 Wave 0 failure log

on:
  pull_request:
    paths:
      - ".github/workflows/phase11-wave0-failure-log.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'phase11/wave0-finishing-line-implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_JOB_ID: "90116043084"
    steps:
      - name: Print failure tail
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/wave0.log"
          clean="${RUNNER_TEMP}/wave0-clean.log"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" > "${raw}"
          sed -r 's/\x1B\[[0-9;]*[mK]//g; s/^.*Z //' "${raw}" > "${clean}"
          tail -n 40 "${clean}"
