name: DIREKT RC7 terminal-receipt diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/rc7-terminal-receipt-diagnostic.yml"

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  diagnostic:
    name: Read exact-main RC7 terminal receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect latest main run, receipt and sanitized managed step
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="${RUNNER_TEMP}/runs.json"
          jobs="${RUNNER_TEMP}/jobs.json"
          artifacts="${RUNNER_TEMP}/artifacts.json"
          comments="${RUNNER_TEMP}/comments.json"
          logs_zip="${RUNNER_TEMP}/run-logs.zip"
          logs_dir="${RUNNER_TEMP}/run-logs"
          failure_lines="${RUNNER_TEMP}/failure-lines.txt"
          managed_step="${RUNNER_TEMP}/managed-step-sanitized.txt"
          output="${RUNNER_TEMP}/rc7-terminal-receipt-diagnostic.json"

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/rc7-maps-managed.yml/runs?branch=main&event=push&per_page=100" \
            > "${runs}"
          latest="$(jq -cs '[.[].workflow_runs[]] | sort_by(.created_at) | last' "${runs}")"
          test -n "${latest}"
          test "${latest}" != "null"
          run_id="$(jq -r '.id' <<<"${latest}")"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" > "${jobs}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > "${artifacts}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/261/comments?per_page=100" > "${comments}"

          receipt="$(jq -cs '
            [.[].[]
              | select(.body | startswith("## RC7 managed Google Maps proof receipt"))]
            | sort_by(.created_at)
            | last
          ' "${comments}")"

          redact() {
            sed -E \
              -e 's/AIza[0-9A-Za-z_-]{20,}/[REDACTED_GOOGLE_API_KEY]/g' \
              -e 's/(Bearer|Authorization:)[[:space:]]+[^[:space:]]+/\1 [REDACTED]/gi' \
              -e 's/(GOOGLE_MAPS_SERVER_API_KEY|DIREKT_ANDROID_MAPS_API_KEY|keyString)=([^[:space:]]+)/\1=[REDACTED]/g' \
              -e 's/[0-9A-Za-z_+=\/.:-]{80,}/[REDACTED_LONG_VALUE]/g'
          }

          logs_state="unavailable"
          : > "${failure_lines}"
          : > "${managed_step}"
          mkdir -p "${logs_dir}"
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/logs" > "${logs_zip}"
          logs_code=$?
          set -e
          if [[ ${logs_code} -eq 0 ]] && unzip -tq "${logs_zip}" >/dev/null 2>&1; then
            logs_state="available"
            unzip -q "${logs_zip}" -d "${logs_dir}"
            grep -R -n -C 3 -E -i \
              '##\[error\]|ERROR:|PERMISSION_DENIED|INVALID_ARGUMENT|FAILED|not found|not enabled|quota|budget|denied|forbidden' \
              "${logs_dir}" \
              | redact \
              | tail -n 120 \
              > "${failure_lines}" || true

            step_file="$(find "${logs_dir}" -type f -name '*9_Execute bounded managed proof.txt' -print -quit)"
            if [[ -n "${step_file}" ]]; then
              nl -ba "${step_file}" | redact > "${managed_step}"
            else
              printf 'managed_step_log_not_found\n' > "${managed_step}"
            fi
          else
            printf 'logs_api_exit=%s\n' "${logs_code}" > "${failure_lines}"
            printf 'logs_api_exit=%s\n' "${logs_code}" > "${managed_step}"
          fi

          jq -n \
            --argjson run "${latest}" \
            --slurpfile jobs "${jobs}" \
            --slurpfile artifacts "${artifacts}" \
            --argjson receipt "${receipt:-null}" \
            --arg logsState "${logs_state}" \
            --rawfile failureLines "${failure_lines}" \
            --rawfile managedStep "${managed_step}" \
            '{
              schema: "direkt.rc7.terminal-receipt-diagnostic.v3",
              readOnly: true,
              gcpAccess: false,
              resourceMutation: false,
              secretValuesAccessed: false,
              run: {
                id: $run.id,
                runNumber: $run.run_number,
                runAttempt: $run.run_attempt,
                event: $run.event,
                headBranch: $run.head_branch,
                headSha: $run.head_sha,
                status: $run.status,
                conclusion: $run.conclusion,
                createdAt: $run.created_at,
                updatedAt: $run.updated_at,
                htmlUrl: $run.html_url
              },
              jobs: ($jobs[0].jobs | map({
                id,
                name,
                status,
                conclusion,
                steps: (.steps // [] | map({name, number, status, conclusion}))
              })),
              artifacts: ($artifacts[0].artifacts | map({
                id,
                name,
                sizeInBytes: .size_in_bytes,
                expired,
                digest,
                createdAt: .created_at
              })),
              issueReceipt: (if $receipt == null then null else {
                id: $receipt.id,
                createdAt: $receipt.created_at,
                updatedAt: $receipt.updated_at,
                body: $receipt.body
              } end),
              sanitizedRunLogs: {
                state: $logsState,
                failureLines: ($failureLines | split("\n") | map(select(length > 0))),
                managedStep: ($managedStep | split("\n") | map(select(length > 0)))
              }
            }' > "${output}"

          cat "${output}"
          {
            echo '### RC7 exact-main terminal receipt diagnostic'
            echo
            echo '```json'
            cat "${output}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload sanitized diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: rc7-terminal-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rc7-terminal-receipt-diagnostic.json
            ${{ runner.temp }}/managed-step-sanitized.txt
          if-no-files-found: error
          retention-days: 1
