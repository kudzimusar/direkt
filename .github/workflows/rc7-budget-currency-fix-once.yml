name: RC7 budget currency compatibility fix once

on:
  push:
    branches:
      - integration/runtime-closure-261
    paths:
      - .github/workflows/rc7-budget-currency-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/runtime-closure-261
          fetch-depth: 0
      - name: Patch RC7 billing currency contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bootstrap = Path('scripts/rc7/bootstrap-maps-managed.sh')
          text = bootstrap.read_text()
          text = text.replace(
              'billing_account="$(gcloud billing projects describe "${PROJECT_ID}" --format=\'value(billingAccountName)\' | sed \'s#billingAccounts/##\')"\ntest -n "${billing_account}"\n',
              'billing_account="$(gcloud billing projects describe "${PROJECT_ID}" --format=\'value(billingAccountName)\' | sed \'s#billingAccounts/##\')"\ntest -n "${billing_account}"\nbilling_currency="$(gcloud billing accounts describe "${billing_account}" --format=\'value(currencyCode)\')"\ntest -n "${billing_currency}"\nbudget_amount="1"\n',
          )
          text = text.replace('--budget-amount 1USD', '--budget-amount "${budget_amount}"')
          text = text.replace('test "${actual_budget_units}" = "1"\n', 'test "${actual_budget_units}" = "1"\nactual_budget_currency="$(gcloud billing budgets describe "${budget_name##*/}" \\\n  --billing-account "${billing_account}" \\\n  --format=\'value(amount.specifiedAmount.currencyCode)\')"\ntest "${actual_budget_currency}" = "${billing_currency}"\n')
          text = text.replace('direkt-rc7-bootstrap=ready,direkt-rc7-budget=usd1,direkt-rc7-quota=60', 'direkt-rc7-bootstrap=ready,direkt-rc7-budget=unit1,direkt-rc7-quota=60')
          text = text.replace("printf 'budget_amount_usd=1\\n'", "printf 'budget_amount=1\\n'\nprintf 'budget_currency=%s\\n' \"${billing_currency}\"")
          bootstrap.write_text(text)

          managed = Path('scripts/rc7/run-maps-managed.sh')
          text = managed.read_text()
          text = text.replace('.labels["direkt-rc7-budget"] == "usd1"', '.labels["direkt-rc7-budget"] == "unit1"')
          text = text.replace('receipt "budget_amount_usd=1"', 'receipt "budget_amount=1"\nreceipt "budget_currency=account"')
          managed.write_text(text)

          verifier = Path('scripts/rc7/verify-maps-contract.py')
          text = verifier.read_text()
          text = text.replace('"budget_amount_usd=1",', '"budget_amount=1",\n        "budget_currency",')
          verifier.write_text(text)

          doc = Path('docs/integrations/RC7_MAPS_OWNER_BOOTSTRAP.md')
          text = doc.read_text()
          text = text.replace('creates or lowers/verifies the $1 monthly RC7 budget', 'creates or lowers/verifies a monthly RC7 budget of 1 unit in the billing account’s fixed currency')
          text = text.replace('The $1 budget is an alerting guardrail', 'The 1-unit billing-currency budget is an alerting guardrail')
          text = text.replace('the budget/quota controls', 'the budget amount, detected billing currency, and quota controls')
          doc.write_text(text)
          PY
          bash -n scripts/rc7/bootstrap-maps-managed.sh
          bash -n scripts/rc7/run-maps-managed.sh
          python3 scripts/rc7/verify-maps-contract.py
          rm .github/workflows/rc7-budget-currency-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/rc7/bootstrap-maps-managed.sh scripts/rc7/run-maps-managed.sh scripts/rc7/verify-maps-contract.py docs/integrations/RC7_MAPS_OWNER_BOOTSTRAP.md .github/workflows/rc7-budget-currency-fix-once.yml
          git commit -m 'fix(rc7): honor billing account currency'
          git push origin HEAD:integration/runtime-closure-261
