name: RC7 closure compatibility reconciler

on:
  pull_request:
    paths:
      - ".github/workflows/rc7-closure-compatibility-reconcile.yml"
      - "scripts/rc7/patch-closure-compatibility.py"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'close/rc7-google-maps-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: close/rc7-google-maps-runtime
          fetch-depth: 0
      - name: Reconcile historical closure verifiers
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/rc7/patch-closure-compatibility.py ]]; then
            echo 'RC7 closure compatibility already reconciled.'
            exit 0
          fi
          python3 scripts/rc7/patch-closure-compatibility.py
          python3 scripts/rc5/verify-test-lab-closure.py
          python3 scripts/rc6/verify-whatsapp-contract.py
          python3 -m py_compile \
            scripts/rc5/verify-test-lab-closure.py \
            scripts/rc6/verify-whatsapp-contract.py
          rm scripts/rc7/patch-closure-compatibility.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/rc5/verify-test-lab-closure.py \
            scripts/rc6/verify-whatsapp-contract.py \
            scripts/rc7/patch-closure-compatibility.py
          git diff --cached --check
          git commit -m 'test(rc7): preserve RC5 and RC6 after Maps closure'
          git push origin HEAD:close/rc7-google-maps-runtime
