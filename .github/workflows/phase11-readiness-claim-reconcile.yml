name: Phase 11 primary-pilot readiness claim

on:
  pull_request:
    paths:
      - ".github/workflows/phase11-readiness-claim-reconcile.yml"
      - "scripts/phase11/patch-primary-pilot-readiness-claim.py"
      - "scripts/phase11/patch-rc11-later-lane.py"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'phase11/primary-pilot-readiness-claim'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase11/primary-pilot-readiness-claim
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply and verify Phase 11 readiness claim
        run: |
          set -euo pipefail
          python3 scripts/phase11/patch-primary-pilot-readiness-claim.py
          python3 scripts/phase11/patch-rc11-later-lane.py
          python3 scripts/rc8/verify-payments-contract.py
          python3 scripts/rc9/verify-generated-client-contract.py
          python3 scripts/rc10/verify-turnstile-decision.py
          python3 scripts/rc11/verify-final-integration-closure.py
          rm scripts/phase11/patch-primary-pilot-readiness-claim.py scripts/phase11/patch-rc11-later-lane.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add WORKSTREAM_LOCK.md scripts/rc11/verify-final-integration-closure.py scripts/phase11/patch-primary-pilot-readiness-claim.py scripts/phase11/patch-rc11-later-lane.py
          git diff --cached --check
          git commit -m 'chore(phase11): claim primary-pilot readiness'
          git push origin HEAD:phase11/primary-pilot-readiness-claim
