name: RC9 closeout reconciler

on:
  pull_request:
    paths:
      - ".github/workflows/rc9-closeout-reconcile.yml"
      - "scripts/rc9/patch-closeout.py"

permissions:
  contents: write

concurrency:
  group: rc9-closeout-reconcile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/rc9-closeout'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/rc9-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply and verify RC9D closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rc9/patch-closeout.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/integrations/RC9_CLOSURE_RECEIPT.md")
          path.write_text("\n".join(line.rstrip() for line in path.read_text(encoding="utf-8").splitlines()) + "\n", encoding="utf-8")
          PY
          python3 scripts/rc9/verify-generated-foundation.py
          python3 scripts/rc9/verify-generated-client-contract.py
          python3 scripts/rc8/verify-payments-contract.py
          python3 scripts/rc7/verify-maps-contract.py
          python3 scripts/rc6/verify-whatsapp-contract.py
          python3 scripts/rc5/verify-test-lab-closure.py

          rm scripts/rc9/patch-closeout.py
          rm .github/workflows/rc9-closeout-reconcile.yml
          rm .github/workflows/rc9-closeout-failure-log.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            WORKSTREAM_LOCK.md \
            PROJECT_STATUS.md \
            docs/integrations/CURRENT_INTEGRATION_STATUS.md \
            docs/integrations/LIVE_INTEGRATION_LEDGER.md \
            docs/integrations/RC9_GENERATED_CLIENTS_IMPLEMENTATION.md \
            docs/integrations/RC9_CLOSURE_RECEIPT.md \
            scripts/rc9/verify-generated-client-contract.py \
            scripts/rc9/patch-closeout.py \
            .github/workflows/rc9-closeout-reconcile.yml \
            .github/workflows/rc9-closeout-failure-log.yml
          git diff --cached --check
          git commit -m 'docs(rc9): close generated-client checkpoint'
          git push origin HEAD:docs/rc9-closeout
