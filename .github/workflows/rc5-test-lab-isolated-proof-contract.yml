name: DIREKT RC5 isolated managed proof bridge contract

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rc5-test-lab-isolated-proof-once.yml
      - .github/workflows/rc5-test-lab-isolated-proof-contract.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/rc5-test-lab-isolated-proof-once.yml
      - .github/workflows/rc5-test-lab-isolated-proof-contract.yml

permissions:
  contents: read

jobs:
  verify:
    name: Verify isolated managed proof bridge authority and receipt contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Parse bridge YAML and require bounded GitHub authority
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require "yaml"
          path = ".github/workflows/rc5-test-lab-isolated-proof-once.yml"
          doc = YAML.safe_load(File.read(path), aliases: true)
          raise "workflow document must be a mapping" unless doc.is_a?(Hash)
          raise "unexpected workflow name" unless doc["name"] == "DIREKT RC5 isolated Test Lab managed proof bridge"
          push = doc.fetch("on").fetch("push")
          raise "main-only trigger drift" unless push.fetch("branches") == ["main"]
          raise "path trigger drift" unless push.fetch("paths") == [path]
          expected = {"contents" => "read", "actions" => "write", "issues" => "write"}
          raise "permission drift" unless doc.fetch("permissions") == expected
          jobs = doc.fetch("jobs")
          raise "unexpected job set" unless jobs.keys == ["dispatch"]
          job = jobs.fetch("dispatch")
          raise "bridge timeout drift" unless job["timeout-minutes"] == 70
          raise "bridge must not declare an environment" if job.key?("environment")
          RUBY

      - name: Verify exact target dispatch and schema validation
        shell: bash
        run: |
          set -euo pipefail
          bridge=.github/workflows/rc5-test-lab-isolated-proof-once.yml
          grep -Fq 'workflow="firebase-test-lab-isolated.yml"' "${bridge}"
          grep -Fq 'expected_name="DIREKT Firebase Test Lab isolated Android matrix"' "${bridge}"
          grep -Fq 'confirmation:"RUN-DIREKT-ISOLATED-TEST-LAB"' "${bridge}"
          grep -Fq 'source_sha:$sha' "${bridge}"
          grep -Fq 'head_sha == $sha' "${bridge}"
          grep -Fq 'More than one new exact-source isolated Test Lab run appeared.' "${bridge}"
          grep -Fq 'rc5-isolated-firebase-test-lab-${run_id}-${run_attempt}' "${bridge}"
          grep -Fq 'direkt.rc5.isolated-test-lab-receipt.v1' "${bridge}"
          grep -Fq 'direkt.rc5.test-lab-matrix.v1' "${bridge}"
          grep -Fq 'direkt-testlab-502701-20260726' "${bridge}"
          grep -Fq '482116157386' "${bridge}"
          grep -Fq 'firebase-managed-default-bucket' "${bridge}"
          grep -Fq 'roles/editor-isolated-project-only' "${bridge}"
          grep -Fq '.exitCode' "${bridge}"
          grep -Fq '.category' "${bridge}"
          grep -Fq 'available_and_schema_validated_passed' "${bridge}"
          grep -Fq 'select(.version == "26")' "${bridge}"
          grep -Fq 'select(.version == "33")' "${bridge}"
          grep -Fq 'select(. >= 35 and . <= 36)' "${bridge}"
          grep -Fq '.flakyRetries == 0' "${bridge}"
          grep -Fq '.orchestrator == false' "${bridge}"
          grep -Fq '.video == false' "${bridge}"
          grep -Fq '.performanceMetrics == false' "${bridge}"
          grep -Fq '.automaticGoogleLogin == false' "${bridge}"
          grep -Fq '.participantData == false' "${bridge}"
          grep -Fq '.productionAuthorization == false' "${bridge}"

      - name: Reject Google Cloud and production authority in bridge
        shell: bash
        run: |
          set -euo pipefail
          bridge=.github/workflows/rc5-test-lab-isolated-proof-once.yml
          ! grep -Fq 'id-token: write' "${bridge}"
          ! grep -Fq 'google-github-actions/auth' "${bridge}"
          ! grep -Fq 'gcloud ' "${bridge}"
          ! grep -Fq 'firebase test android run' "${bridge}"
          ! grep -Fq 'gs://' "${bridge}"
          ! grep -Eq '(set-iam-policy|add-iam-policy-binding|services enable|buckets create|buckets update)' "${bridge}"
          ! grep -Ei '(private_key|client_secret|access_token[[:space:]]*:)' "${bridge}"

      - name: Publish contract summary
        shell: bash
        run: |
          {
            echo '### RC5 isolated managed proof bridge contract'
            echo '- Trigger: main and bridge path only'
            echo '- Authority: GitHub Actions + issues only'
            echo '- Target: permanent isolated Test Lab workflow'
            echo '- Source: exact current main with unique new dispatch'
            echo '- Evidence: isolated receipt + three-device matrix schema validated'
            echo '- Participant/production authorization: false'
          } >> "${GITHUB_STEP_SUMMARY}"
