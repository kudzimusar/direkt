name: DIREKT temporary RC6 portal ESLint security finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rc6-portal-eslint-security-finalize.yml

permissions:
  contents: write

concurrency:
  group: direkt-rc6-portal-eslint-security-finalize
  cancel-in-progress: false

jobs:
  finalize:
    name: Commit audit-clean portal ESLint graph
    if: >-
      github.repository == 'kudzimusar/direkt' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/rc6-whatsapp-run-bridge-8fe357e'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin/direkt-operations-portal/package-lock.json

      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          remote_head="$(git ls-remote origin "refs/heads/${EXPECTED_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${EXPECTED_HEAD}"

      - name: Resolve and audit portal ESLint 10 graph
        shell: bash
        working-directory: admin/direkt-operations-portal
        run: |
          set -euo pipefail
          npm install --global npm@11.16.0
          test "$(npm view eslint@10.8.0 version)" = "10.8.0"
          npm install --save-dev --save-exact eslint@10.8.0
          npm audit --audit-level=high

      - name: Verify portal with patched lint graph
        shell: bash
        working-directory: admin/direkt-operations-portal
        run: |
          set -euo pipefail
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Commit verified portal security fix and self-remove
        shell: bash
        env:
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git rm .github/workflows/rc6-portal-eslint-security-finalize.yml
          git diff --check
          git diff --exit-code -- \
            admin/direkt-operations-portal/package.json \
            admin/direkt-operations-portal/package-lock.json && exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            admin/direkt-operations-portal/package.json \
            admin/direkt-operations-portal/package-lock.json
          git commit -m "fix(security): update portal ESLint toolchain"
          git push origin "HEAD:${EXPECTED_BRANCH}"
