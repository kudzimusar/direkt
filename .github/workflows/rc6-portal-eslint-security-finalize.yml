name: DIREKT temporary RC6 portal dependency security finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rc6-portal-eslint-security-finalize.yml

permissions:
  contents: write

concurrency:
  group: direkt-rc6-portal-eslint-security-finalize
  cancel-in-progress: false

jobs:
  finalize:
    name: Commit audit-clean portal lock graph
    if: >-
      github.repository == 'kudzimusar/direkt' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'integration/rc6-whatsapp-run-bridge-8fe357e'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DIAGNOSTICS_DIR: ${{ github.workspace }}/artifacts/rc6-portal-security
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin/direkt-operations-portal/package-lock.json

      - name: Verify exact PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          remote_head="$(git ls-remote origin "refs/heads/${EXPECTED_BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${EXPECTED_HEAD}"

      - name: Refresh vulnerable transitive ranges without major config changes
        shell: bash
        working-directory: admin/direkt-operations-portal
        run: |
          set -euo pipefail
          mkdir -p "${DIAGNOSTICS_DIR}"
          npm install --global npm@11.16.0
          npm ci
          npm update minimatch brace-expansion
          npm ls eslint eslint-config-next minimatch brace-expansion --all --json > "${DIAGNOSTICS_DIR}/resolved-tree.json"
          npm audit --json > "${DIAGNOSTICS_DIR}/npm-audit.json"

      - name: Verify unchanged portal lint and production contracts
        shell: bash
        working-directory: admin/direkt-operations-portal
        run: |
          set -euo pipefail
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Upload sanitized portal dependency receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-portal-security-${{ github.run_id }}
          path: artifacts/rc6-portal-security
          if-no-files-found: warn
          retention-days: 30

      - name: Commit verified portal lock refresh and self-remove
        shell: bash
        env:
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git rm .github/workflows/rc6-portal-eslint-security-finalize.yml
          git diff --check
          git diff --exit-code -- admin/direkt-operations-portal/package.json || {
            echo "::error title=Unexpected direct portal dependency change::Only the existing semver-compatible lock graph may change."
            exit 1
          }
          git diff --exit-code -- admin/direkt-operations-portal/package-lock.json && {
            echo "::error title=No portal lock refresh produced::Expected transitive patched versions."
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/direkt-operations-portal/package-lock.json
          git commit -m "fix(security): refresh portal dependency lock"
          git push origin "HEAD:${EXPECTED_BRANCH}"
