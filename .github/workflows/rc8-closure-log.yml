name: RC8 closure validation log

on:
  pull_request:
    paths:
      - ".github/workflows/rc8-closure-log.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/rc8-managed-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_JOB_ID: "89900521280"
    steps:
      - name: Print bounded RC8 closure failure
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/rc8-closure.log"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" > "${raw}"
          grep -E 'RC8_|AssertionError|Traceback|missing|expected|prohibits|Process completed with exit code|SyntaxError|Error:' "${raw}" | tail -n 160 || true
