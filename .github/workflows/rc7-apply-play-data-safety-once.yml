name: DIREKT RC7 apply Play Data Safety once

on:
  pull_request:
    paths:
      - "scripts/rc7/apply-play-data-safety.py"
      - ".github/workflows/rc7-apply-play-data-safety-once.yml"
  push:
    branches:
      - integration/runtime-closure-261
    paths:
      - "scripts/rc7/apply-play-data-safety.py"
      - ".github/workflows/rc7-apply-play-data-safety-once.yml"

permissions:
  contents: write

concurrency:
  group: direkt-rc7-play-data-safety-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/runtime-closure-261
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reconcile Maps SDK with Phase 12B source truth
        run: python3 scripts/rc7/apply-play-data-safety.py
      - name: Verify reconciliation
        id: verify
        shell: bash
        run: |
          set +e
          {
            echo "== Phase 12B verifier =="
            python3 scripts/verify-phase12-play-readiness.py
            phase12_status=$?
            echo "phase12_status=${phase12_status}"
            echo "== RC7 verifier =="
            python3 scripts/rc7/verify-maps-contract.py
            rc7_status=$?
            echo "rc7_status=${rc7_status}"
          } 2>&1 | tee rc7-play-reconciliation-diagnostic.txt
          phase12_status=$(grep '^phase12_status=' rc7-play-reconciliation-diagnostic.txt | tail -1 | cut -d= -f2)
          rc7_status=$(grep '^rc7_status=' rc7-play-reconciliation-diagnostic.txt | tail -1 | cut -d= -f2)
          test "${phase12_status}" = "0" && test "${rc7_status}" = "0"
      - name: Upload reconciliation diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc7-play-reconciliation-diagnostic
          path: rc7-play-reconciliation-diagnostic.txt
          if-no-files-found: error
          retention-days: 3
      - name: Commit reconciliation and remove bridge
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/rc7/apply-play-data-safety.py
          rm .github/workflows/rc7-apply-play-data-safety-once.yml
          rm -f rc7-play-reconciliation-diagnostic.txt
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(rc7): reconcile Maps SDK Play Data Safety inventory"
          git push origin HEAD:integration/runtime-closure-261
