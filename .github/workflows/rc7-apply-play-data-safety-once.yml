name: DIREKT RC7 apply Play Data Safety once

on:
  push:
    branches:
      - integration/runtime-closure-261
    paths:
      - "scripts/rc7/apply-play-data-safety.py"
      - ".github/workflows/rc7-apply-play-data-safety-once.yml"

permissions:
  contents: write

concurrency:
  group: direkt-rc7-play-data-safety-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/runtime-closure-261
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reconcile Maps SDK with Phase 12B source truth
        run: python3 scripts/rc7/apply-play-data-safety.py
      - name: Verify and commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-phase12-play-readiness.py
          python3 scripts/rc7/verify-maps-contract.py
          rm scripts/rc7/apply-play-data-safety.py
          rm .github/workflows/rc7-apply-play-data-safety-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(rc7): reconcile Maps SDK Play Data Safety inventory"
          git push origin HEAD:integration/runtime-closure-261
