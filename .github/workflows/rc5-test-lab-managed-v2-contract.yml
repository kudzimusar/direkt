name: DIREKT RC5 Test Lab v2 contract

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/firebase-test-lab-managed.yml
      - .github/workflows/rc5-test-lab-managed-v2-contract.yml
      - scripts/rc5/run-test-lab-managed.sh
      - scripts/rc5/test-lab-runner-permissions.txt
  push:
    branches:
      - main
    paths:
      - .github/workflows/firebase-test-lab-managed.yml
      - .github/workflows/rc5-test-lab-managed-v2-contract.yml
      - scripts/rc5/run-test-lab-managed.sh
      - scripts/rc5/test-lab-runner-permissions.txt

permissions:
  contents: read

jobs:
  verify:
    name: Verify schema-valid least-privilege RC5 v2 contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Parse workflow YAML and require dispatch contract
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require "yaml"
          path = ".github/workflows/firebase-test-lab-managed.yml"
          doc = YAML.safe_load(File.read(path), aliases: true)
          raise "workflow document must be a mapping" unless doc.is_a?(Hash)
          raise "unexpected workflow name" unless doc["name"] == "DIREKT Firebase Test Lab Android matrix v2"
          trigger = doc.fetch("on").fetch("workflow_dispatch")
          inputs = trigger.fetch("inputs")
          %w[confirmation source_sha].each do |name|
            input = inputs.fetch(name)
            raise "#{name} must be required" unless input["required"] == true
            raise "#{name} must be string" unless input["type"] == "string"
          end
          permissions = doc.fetch("permissions")
          raise "contents permission drift" unless permissions == {"contents" => "read", "id-token" => "write"}
          jobs = doc.fetch("jobs")
          raise "unexpected job set" unless jobs.keys == ["android-matrix"]
          job = jobs.fetch("android-matrix")
          raise "production environment prohibited" unless job["environment"] == "staging"
          raise "matrix timeout drift" unless job["timeout-minutes"] == 55
          RUBY

      - name: Verify runner shell and permission manifest
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/rc5/run-test-lab-managed.sh
          manifest=scripts/rc5/test-lab-runner-permissions.txt
          test -s "${manifest}"
          test "$(sed '/^$/d' "${manifest}" | wc -l | tr -d ' ')" = "32"
          test "$(sed '/^$/d' "${manifest}" | sort -u | wc -l | tr -d ' ')" = "32"
          grep -Fxq serviceusage.services.get "${manifest}"
          ! grep -Fxq serviceusage.services.list "${manifest}"
          ! grep -Eq '^storage\.' "${manifest}"

      - name: Verify bounded managed execution controls
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/firebase-test-lab-managed.yml
          runner=scripts/rc5/run-test-lab-managed.sh
          grep -Fq 'RUN-DIREKT-TEST-LAB' "${workflow}"
          grep -Fq 'google-github-actions/auth@v3' "${workflow}"
          grep -Fq 'workload_identity_provider:' "${workflow}"
          grep -Fq -- '--num-flaky-test-attempts 0' "${runner}"
          grep -Fq -- '--no-use-orchestrator' "${runner}"
          grep -Fq -- '--no-record-video' "${runner}"
          grep -Fq -- '--no-performance-metrics' "${runner}"
          grep -Fq -- '--no-auto-google-login' "${runner}"
          grep -Fq 'device_count' "${runner}"
          grep -Fq 'productionAuthorization: false' "${runner}"
          grep -Fq 'synthetic-public-safe-only' "${runner}"
          ! grep -Fq 'gcloud services describe' "${runner}"
          ! grep -Fq 'serviceusage.services.list' "${runner}"
          ! grep -Eq 'roles/(owner|editor|storage\.admin|storage\.objectAdmin)' "${workflow}"
          ! grep -Ei '(private_key|client_secret|access_token[[:space:]]*:)' "${workflow}" "${runner}"

      - name: Publish contract summary
        shell: bash
        run: |
          {
            echo '### RC5 Test Lab v2 contract'
            echo '- Workflow YAML: parsed'
            echo '- Dispatch inputs: exact and required'
            echo '- GitHub OIDC: required'
            echo '- Runner permission manifest: exact, unique, no Storage permissions'
            echo '- Matrix: bounded to 2–3 devices with zero flaky retries'
            echo '- Participant/production authorization: false'
          } >> "${GITHUB_STEP_SUMMARY}"
