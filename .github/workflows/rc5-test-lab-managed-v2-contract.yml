name: DIREKT RC5 Test Lab v2 contract

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/firebase-test-lab-managed.yml
      - .github/workflows/rc5-test-lab-managed-v2-contract.yml
      - scripts/rc5/bootstrap-test-lab.sh
      - scripts/rc5/run-test-lab-managed.sh
      - scripts/rc5/append-only-storage-upload.sh
      - scripts/rc5/test-lab-runner-permissions.txt
  push:
    branches:
      - main
    paths:
      - .github/workflows/firebase-test-lab-managed.yml
      - .github/workflows/rc5-test-lab-managed-v2-contract.yml
      - scripts/rc5/bootstrap-test-lab.sh
      - scripts/rc5/run-test-lab-managed.sh
      - scripts/rc5/append-only-storage-upload.sh
      - scripts/rc5/test-lab-runner-permissions.txt

permissions:
  contents: read

jobs:
  verify:
    name: Verify schema-valid least-privilege RC5 v2 contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Parse workflow YAML and require dispatch contract
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require "yaml"
          path = ".github/workflows/firebase-test-lab-managed.yml"
          doc = YAML.safe_load(File.read(path), aliases: true)
          raise "workflow document must be a mapping" unless doc.is_a?(Hash)
          raise "unexpected workflow name" unless doc["name"] == "DIREKT Firebase Test Lab Android matrix v2"
          trigger = doc.fetch("on").fetch("workflow_dispatch")
          inputs = trigger.fetch("inputs")
          %w[confirmation source_sha].each do |name|
            input = inputs.fetch(name)
            raise "#{name} must be required" unless input["required"] == true
            raise "#{name} must be string" unless input["type"] == "string"
          end
          permissions = doc.fetch("permissions")
          raise "contents permission drift" unless permissions == {"contents" => "read", "id-token" => "write"}
          jobs = doc.fetch("jobs")
          raise "unexpected job set" unless jobs.keys == ["android-matrix"]
          job = jobs.fetch("android-matrix")
          raise "production environment prohibited" unless job["environment"] == "staging"
          raise "matrix timeout drift" unless job["timeout-minutes"] == 55
          env = job.fetch("env")
          raise "results bucket drift" unless env["GCP_TEST_LAB_RESULTS_BUCKET"] == "gs://direkt-test-lab-results-264358173369"
          raise "input bucket drift" unless env["GCP_TEST_LAB_INPUT_BUCKET"] == "gs://direkt-test-lab-inputs-264358173369"
          raise "input role drift" unless env["GCP_TEST_LAB_INPUT_ROLE"] == "projects/direkt-dev-502701/roles/direktTestLabInputStager"
          raise "input retention drift" unless env["GCP_TEST_LAB_INPUT_RETENTION_DAYS"] == "1"
          RUBY

      - name: Verify runner shell and project permission manifest
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/rc5/bootstrap-test-lab.sh
          bash -n scripts/rc5/run-test-lab-managed.sh
          bash -n scripts/rc5/append-only-storage-upload.sh
          manifest=scripts/rc5/test-lab-runner-permissions.txt
          test -s "${manifest}"
          test "$(sed '/^$/d' "${manifest}" | wc -l | tr -d ' ')" = "32"
          test "$(sed '/^$/d' "${manifest}" | sort -u | wc -l | tr -d ' ')" = "32"
          grep -Fxq serviceusage.services.get "${manifest}"
          ! grep -Fxq serviceusage.services.list "${manifest}"
          ! grep -Eq '^storage\.' "${manifest}"

      - name: Verify split results and APK-input role contracts
        shell: bash
        run: |
          set -euo pipefail
          bootstrap=scripts/rc5/bootstrap-test-lab.sh
          runner=scripts/rc5/run-test-lab-managed.sh
          grep -Fq 'test-lab-results-permissions.txt' "${bootstrap}"
          grep -Fq 'test-lab-input-permissions.txt' "${bootstrap}"
          grep -Fq 'storage.objects.create' "${bootstrap}"
          grep -Fq 'storage.objects.get' "${bootstrap}"
          grep -Fq 'direktTestLabInputStager' "${bootstrap}" "${runner}"
          grep -Fq 'direkt-test-lab-inputs-${project_number}' "${bootstrap}"
          grep -Fq 'input_retention_days="${GCP_TEST_LAB_INPUT_RETENTION_DAYS:-1}"' "${bootstrap}"
          grep -Fq "expected_results_permissions=\$'storage.buckets.get\\nstorage.buckets.getIamPolicy\\nstorage.objects.create'" "${runner}"
          grep -Fq "expected_input_permissions=\$'storage.buckets.get\\nstorage.buckets.getIamPolicy\\nstorage.objects.create\\nstorage.objects.get'" "${runner}"
          ! grep -Eq '^storage\.objects\.(delete|list|update)$' <(sed -n '/test-lab-input-permissions.txt/,/^EOF$/p' "${bootstrap}")

      - name: Verify immutable evidence and APK upload boundary
        shell: bash
        run: |
          set -euo pipefail
          runner=scripts/rc5/run-test-lab-managed.sh
          uploader=scripts/rc5/append-only-storage-upload.sh
          grep -Fq 'bash "${append_only_uploader}"' "${runner}"
          grep -Fq 'https://storage.googleapis.com/upload/storage/v1/b/' "${uploader}"
          grep -Fq 'uploadType=media' "${uploader}"
          grep -Fq 'ifGenerationMatch=0' "${uploader}"
          grep -Fq 'append_only_object_insert=verified' "${uploader}"
          grep -Fq 'direkt-test-lab-results-${project_number}' "${uploader}"
          grep -Fq 'direkt-test-lab-inputs-${project_number}' "${uploader}"
          grep -Fq '[[ "${object_name}" == rc5/preflight/* ]]' "${uploader}"
          grep -Fq '[[ "${object_name}" == rc5/inputs/* ]]' "${uploader}"
          grep -Fq 'application/vnd.android.package-archive' "${uploader}"
          ! grep -Fq 'gcloud storage cp' "${runner}" "${uploader}"
          ! grep -Fq 'userProject=' "${uploader}"
          ! grep -Eq 'storage\.objects\.(delete|list|update)' "${runner}" "${uploader}" scripts/rc5/test-lab-runner-permissions.txt

      - name: Verify bounded managed execution controls
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/firebase-test-lab-managed.yml
          runner=scripts/rc5/run-test-lab-managed.sh
          grep -Fq 'RUN-DIREKT-TEST-LAB' "${workflow}"
          grep -Fq 'google-github-actions/auth@v3' "${workflow}"
          grep -Fq 'workload_identity_provider:' "${workflow}"
          grep -Fq 'input_prefix="rc5/inputs/${SOURCE_SHA}/${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}"' "${runner}"
          grep -Fq 'app_input_uri="gs://${input_bucket_name}/${app_input_object}"' "${runner}"
          grep -Fq 'test_input_uri="gs://${input_bucket_name}/${test_input_object}"' "${runner}"
          grep -Fq -- '--app "${app_input_uri}"' "${runner}"
          grep -Fq -- '--test "${test_input_uri}"' "${runner}"
          grep -Fq -- '--num-flaky-test-attempts 0' "${runner}"
          grep -Fq -- '--no-use-orchestrator' "${runner}"
          grep -Fq -- '--no-record-video' "${runner}"
          grep -Fq -- '--no-performance-metrics' "${runner}"
          grep -Fq -- '--no-auto-google-login' "${runner}"
          grep -Fq 'device_count' "${runner}"
          grep -Fq 'inputObjectAccess: "create-get-no-list-delete-update"' "${runner}"
          grep -Fq 'inputRetentionDays: 1' "${runner}"
          grep -Fq 'productionAuthorization: false' "${runner}"
          grep -Fq 'synthetic-public-safe-only' "${runner}"
          ! grep -Fq 'gcloud services describe' "${runner}"
          ! grep -Fq 'serviceusage.services.list' "${runner}"
          ! grep -Eq 'roles/(owner|editor|storage\.admin|storage\.objectAdmin)' "${workflow}"
          ! grep -Ei '(private_key|client_secret|access_token[[:space:]]*:)' "${workflow}" "${runner}"

      - name: Publish contract summary
        shell: bash
        run: |
          {
            echo '### RC5 Test Lab v2 contract'
            echo '- Workflow YAML: parsed'
            echo '- Dispatch inputs: exact and required'
            echo '- GitHub OIDC: required'
            echo '- Project runner: exact non-Storage permission manifest'
            echo '- Results bucket: 30-day append-only objects'
            echo '- APK input bucket: 1-day create/get, no list/delete/update'
            echo '- APK references: explicit immutable gs:// paths'
            echo '- Matrix: bounded to 2–3 devices with zero flaky retries'
            echo '- Participant/production authorization: false'
          } >> "${GITHUB_STEP_SUMMARY}"
