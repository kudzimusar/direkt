name: DIREKT RC11 final integration closure

on:
  pull_request:
    paths:
      - "WORKSTREAM_LOCK.md"
      - "PROJECT_STATUS.md"
      - "docs/integrations/**"
      - "scripts/rc8/**"
      - "scripts/rc9/**"
      - "scripts/rc10/**"
      - "scripts/rc11/**"
      - ".github/workflows/rc11-final-integration-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify RC8-RC11 preserved contracts
        run: |
          set -euo pipefail
          python3 scripts/rc8/verify-payments-contract.py
          python3 scripts/rc9/verify-generated-client-contract.py
          python3 scripts/rc10/verify-turnstile-decision.py
          python3 scripts/rc11/verify-final-integration-closure.py
