name: UIA promotion bridge lint

on:
  pull_request:
    paths:
      - ".github/workflows/uia-current-main-refresh-closeout-once.yml"
      - ".github/workflows/uia-promotion-bridge-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/uia-promotion-bridge-yaml'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate corrected bridge
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            -no-color \
            .github/workflows/uia-current-main-refresh-closeout-once.yml
