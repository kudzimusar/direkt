name: DIREKT RC7 rejection formatting evidence

on:
  pull_request:
    paths:
      - ".github/workflows/rc7-rejection-format.yml"

permissions:
  contents: read

jobs:
  format:
    name: Format exact RC7 rejection files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/direkt-api/package-lock.json
      - name: Install pinned backend tools
        working-directory: backend/direkt-api
        run: npm ci --ignore-scripts
      - name: Apply repository Prettier output
        working-directory: backend/direkt-api
        run: |
          npm exec prettier -- --write \
            src/location/geocoding-provider.port.ts \
            src/location/google-maps-geocoding-provider.adapter.ts \
            src/location/location.service.ts \
            test/unit/location/google-maps-geocoding-provider.adapter.spec.ts
      - name: Upload exact formatted source
        uses: actions/upload-artifact@v4
        with:
          name: rc7-rejection-formatted-${{ github.run_id }}
          path: |
            backend/direkt-api/src/location/geocoding-provider.port.ts
            backend/direkt-api/src/location/google-maps-geocoding-provider.adapter.ts
            backend/direkt-api/src/location/location.service.ts
            backend/direkt-api/test/unit/location/google-maps-geocoding-provider.adapter.spec.ts
          if-no-files-found: error
          retention-days: 1
