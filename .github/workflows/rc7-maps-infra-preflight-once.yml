name: DIREKT RC7 Maps infrastructure preflight once

on:
  pull_request:
    paths:
      - ".github/workflows/rc7-maps-infra-preflight-once.yml"
  push:
    branches:
      - integration/runtime-closure-261
    paths:
      - ".github/workflows/rc7-maps-infra-preflight-once.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: direkt-rc7-maps-infra-preflight-once
  cancel-in-progress: false

jobs:
  preflight:
    name: Inspect Maps APIs, credentials, quota, billing and egress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      GCP_PROJECT_ID: direkt-dev-502701
      GCP_REGION: asia-northeast1
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/264358173369/locations/global/workloadIdentityPools/direkt-github/providers/direkt-main
      GCP_DEPLOYER_SERVICE_ACCOUNT: direkt-github-deployer@direkt-dev-502701.iam.gserviceaccount.com
      GCP_RUNTIME_SERVICE_ACCOUNT: direkt-api-runtime@direkt-dev-502701.iam.gserviceaccount.com
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify bounded RC7 source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rc7/verify-maps-contract.py
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"

      - name: Authenticate through existing GitHub WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Collect sanitized read-only infrastructure receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/rc7-maps-infra-preflight.txt"
          : > "${receipt}"

          capture() {
            local label="$1"
            shift
            {
              echo "===== ${label} ====="
              if "$@"; then
                echo "RESULT=PASS"
              else
                code=$?
                echo "RESULT=UNAVAILABLE_OR_DENIED"
                echo "EXIT_CODE=${code}"
              fi
              echo
            } >> "${receipt}" 2>&1
          }

          capture identity gcloud auth list --filter=status:ACTIVE --format='value(account)'
          capture project gcloud projects describe "${GCP_PROJECT_ID}" --format='json(projectId,projectNumber,lifecycleState)'
          capture maps_services gcloud services list --enabled --project "${GCP_PROJECT_ID}" --filter='config.name:(maps-android-backend.googleapis.com OR geocoding-backend.googleapis.com OR apikeys.googleapis.com OR serviceusage.googleapis.com OR compute.googleapis.com OR vpcaccess.googleapis.com)' --format='json(config.name,state)'
          capture maps_keys gcloud services api-keys list --project "${GCP_PROJECT_ID}" --format='json(name,uid,displayName,restrictions)'
          capture deployer_project_roles gcloud projects get-iam-policy "${GCP_PROJECT_ID}" --flatten='bindings[].members' --filter="bindings.members:serviceAccount:${GCP_DEPLOYER_SERVICE_ACCOUNT}" --format='json(bindings.role)'
          capture runtime_project_roles gcloud projects get-iam-policy "${GCP_PROJECT_ID}" --flatten='bindings[].members' --filter="bindings.members:serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" --format='json(bindings.role)'
          capture networks gcloud compute networks list --project "${GCP_PROJECT_ID}" --format='json(name,autoCreateSubnetworks,routingConfig.routingMode)'
          capture subnets gcloud compute networks subnets list --project "${GCP_PROJECT_ID}" --regions "${GCP_REGION}" --format='json(name,network,ipCidrRange,privateIpGoogleAccess,purpose)'
          capture routers gcloud compute routers list --project "${GCP_PROJECT_ID}" --regions "${GCP_REGION}" --format='json(name,network,region)'
          capture nat_gateways gcloud compute routers nats list --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --router-region "${GCP_REGION}" --format='json(name,router,natIpAllocateOption,natIps,sourceSubnetworkIpRangesToNat)' || true
          capture static_addresses gcloud compute addresses list --project "${GCP_PROJECT_ID}" --regions "${GCP_REGION}" --format='json(name,address,status,addressType,purpose)'
          capture cloud_run_services gcloud run services list --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format='json(metadata.name,spec.template.metadata.annotations,spec.template.spec.serviceAccountName)'
          capture billing_project gcloud billing projects describe "${GCP_PROJECT_ID}" --format='json(billingAccountName,billingEnabled,projectId)'

          billing_account="$(gcloud billing projects describe "${GCP_PROJECT_ID}" --format='value(billingAccountName)' 2>/dev/null | sed 's#billingAccounts/##' || true)"
          if [[ -n "${billing_account}" ]]; then
            capture budgets gcloud billing budgets list --billing-account "${billing_account}" --format='json(displayName,amount,thresholdRules,budgetFilter.projects,budgetFilter.services,allUpdatesRule.disableDefaultIamRecipients)'
          else
            {
              echo '===== budgets ====='
              echo 'RESULT=UNAVAILABLE_OR_DENIED'
              echo 'REASON=billing_account_not_resolved'
              echo
            } >> "${receipt}"
          fi

          access_token="$(gcloud auth print-access-token)"
          permissions_payload='{"permissions":["apikeys.keys.create","apikeys.keys.get","apikeys.keys.list","apikeys.keys.update","serviceusage.services.enable","serviceusage.quotas.update","secretmanager.secrets.create","secretmanager.secrets.setIamPolicy","compute.networks.create","compute.subnetworks.create","compute.routers.create","compute.routers.update","compute.addresses.create","run.jobs.create","run.jobs.run","billing.budgets.get","billing.budgets.create","billing.budgets.update"]}'
          capture tested_permissions curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${access_token}" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d "${permissions_payload}" \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${GCP_PROJECT_ID}:testIamPermissions"

          sed -E -i 's/(keyString|apiKey|token|secret)[^,}\n]*/\1=REDACTED/Ig' "${receipt}"
          cat "${receipt}"

      - name: Upload sanitized preflight receipt
        uses: actions/upload-artifact@v4
        with:
          name: rc7-maps-infra-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc7-maps-infra-preflight.txt
          if-no-files-found: error
          retention-days: 14
