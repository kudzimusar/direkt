name: RC7 closure reconciler

on:
  pull_request:
    paths:
      - ".github/workflows/rc7-closure-reconcile.yml"
      - "scripts/rc7/patch-close-rc7.py"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'close/rc7-google-maps-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: close/rc7-google-maps-runtime
          fetch-depth: 0
      - name: Apply and validate permanent RC7 closure
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/rc7/patch-close-rc7.py ]]; then
            echo 'RC7 closure source already reconciled.'
            exit 0
          fi
          python3 scripts/rc7/patch-close-rc7.py
          python3 scripts/rc7/verify-maps-contract.py
          python3 scripts/rc7/verify-managed-workflow-context.py
          python3 -m py_compile scripts/rc7/verify-maps-contract.py scripts/rc7/verify-managed-workflow-context.py
          bash -n scripts/rc7/run-maps-managed.sh
          bash -n scripts/rc7/bootstrap-maps-managed.sh
          rm scripts/rc7/patch-close-rc7.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/rc7-maps-managed.yml \
            WORKSTREAM_LOCK.md \
            PROJECT_STATUS.md \
            docs/integrations/CURRENT_INTEGRATION_STATUS.md \
            docs/integrations/LIVE_INTEGRATION_LEDGER.md \
            docs/integrations/RC7_GOOGLE_MAPS_IMPLEMENTATION_NOTES.md \
            docs/integrations/RC7_MAPS_MANAGED_TRIGGER.md \
            scripts/rc7/verify-maps-contract.py \
            scripts/rc7/verify-managed-workflow-context.py \
            scripts/rc7/patch-close-rc7.py
          git diff --cached --check
          git commit -m 'docs(rc7): close Google Maps managed checkpoint'
          git push origin HEAD:close/rc7-google-maps-runtime
