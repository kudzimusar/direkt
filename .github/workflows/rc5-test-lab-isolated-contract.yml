name: DIREKT RC5 isolated Test Lab contract

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/firebase-test-lab-isolated.yml
      - .github/workflows/rc5-test-lab-isolated-contract.yml
      - .github/workflows/rc5-test-lab-closure-contract.yml
      - scripts/rc5/run-test-lab-isolated-preflight.sh
      - scripts/rc5/run-test-lab-isolated-managed.sh
      - scripts/rc5/select-test-lab-matrix.py
      - scripts/rc5/verify-test-lab-closure.py
      - docs/integrations/RC5_ISOLATED_TEST_LAB.md
      - WORKSTREAM_LOCK.md
  push:
    branches:
      - main
    paths:
      - .github/workflows/firebase-test-lab-isolated.yml
      - .github/workflows/rc5-test-lab-isolated-contract.yml
      - .github/workflows/rc5-test-lab-closure-contract.yml
      - scripts/rc5/run-test-lab-isolated-preflight.sh
      - scripts/rc5/run-test-lab-isolated-managed.sh
      - scripts/rc5/select-test-lab-matrix.py
      - scripts/rc5/verify-test-lab-closure.py
      - docs/integrations/RC5_ISOLATED_TEST_LAB.md
      - WORKSTREAM_LOCK.md

permissions:
  contents: read

jobs:
  verify:
    name: Verify isolated Spark Test Lab authority and closed matrix contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Parse permanent workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby - <<'RUBY'
          require "yaml"
          path = ".github/workflows/firebase-test-lab-isolated.yml"
          doc = YAML.safe_load(File.read(path), aliases: true)
          raise "workflow document must be a mapping" unless doc.is_a?(Hash)
          raise "unexpected workflow name" unless doc["name"] == "DIREKT Firebase Test Lab isolated Android matrix"
          trigger = doc.fetch("on").fetch("workflow_dispatch")
          inputs = trigger.fetch("inputs")
          %w[confirmation source_sha].each do |name|
            input = inputs.fetch(name)
            raise "#{name} must be required" unless input["required"] == true
            raise "#{name} must be string" unless input["type"] == "string"
          end
          raise "permission drift" unless doc.fetch("permissions") == {"contents" => "read", "id-token" => "write"}
          jobs = doc.fetch("jobs")
          raise "unexpected job set" unless jobs.keys == ["android-matrix"]
          job = jobs.fetch("android-matrix")
          raise "staging environment required" unless job["environment"] == "staging"
          raise "timeout drift" unless job["timeout-minutes"] == 55
          env = job.fetch("env")
          raise "isolated project drift" unless env["GCP_PROJECT_ID"] == "direkt-testlab-502701-20260726"
          raise "isolated project number drift" unless env["GCP_PROJECT_NUMBER"] == "482116157386"
          raise "WIF drift" unless env["GCP_WORKLOAD_IDENTITY_PROVIDER"] == "projects/264358173369/locations/global/workloadIdentityPools/direkt-github/providers/direkt-main"
          raise "deployer drift" unless env["GCP_DEPLOYER_SERVICE_ACCOUNT"] == "direkt-github-deployer@direkt-dev-502701.iam.gserviceaccount.com"
          RUBY

      - name: Verify permanent shell and isolated authority
        shell: bash
        run: |
          set -euo pipefail
          preflight=scripts/rc5/run-test-lab-isolated-preflight.sh
          managed=scripts/rc5/run-test-lab-isolated-managed.sh
          workflow=.github/workflows/firebase-test-lab-isolated.yml
          bash -n "${preflight}"
          bash -n "${managed}"
          grep -Fq 'direkt-testlab-502701-20260726' "${preflight}" "${managed}" "${workflow}"
          grep -Fq '482116157386' "${preflight}" "${managed}" "${workflow}"
          grep -Fq 'roles/editor' "${preflight}" "${managed}"
          grep -Fq 'deployer_roles' "${preflight}"
          grep -Fq 'roles/owner' "${preflight}" "${managed}"
          grep -Fq 'firebase-managed-default-bucket' "${preflight}" "${managed}"
          ! grep -Fq 'direktTestLabRunner' "${preflight}" "${managed}" "${workflow}"
          ! grep -Fq 'direktTestLabResultsWriter' "${preflight}" "${managed}" "${workflow}"
          ! grep -Fq 'direktTestLabInputStager' "${preflight}" "${managed}" "${workflow}"
          ! grep -Fq 'direkt-test-lab-results-' "${preflight}" "${managed}" "${workflow}"
          ! grep -Fq 'direkt-test-lab-inputs-' "${preflight}" "${managed}" "${workflow}"

      - name: Verify supported local APK and bounded execution controls
        shell: bash
        run: |
          set -euo pipefail
          managed=scripts/rc5/run-test-lab-isolated-managed.sh
          python3 - "${managed}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()
          output_line = '  --output "${RUNNER_TEMP}/rc5-test-lab-matrix.json"'
          count_line = 'device_count="$(jq -r \'.deviceCount\' "${RUNNER_TEMP}/rc5-test-lab-matrix.json")"'
          assert output_line in lines, "exact selector output line missing"
          index = lines.index(output_line)
          assert index + 1 < len(lines), "device-count assignment missing"
          assert lines[index + 1] == count_line, "selector output and device-count assignment must be adjacent physical lines"
          assert r"\ndevice_count=" not in text, "literal newline escape reintroduced"
          PY
          grep -Fq -- '--app "${app_apk}"' "${managed}"
          grep -Fq -- '--test "${test_apk}"' "${managed}"
          grep -Fq -- '--num-flaky-test-attempts 0' "${managed}"
          grep -Fq -- '--no-use-orchestrator' "${managed}"
          grep -Fq -- '--no-record-video' "${managed}"
          grep -Fq -- '--no-performance-metrics' "${managed}"
          grep -Fq -- '--no-auto-google-login' "${managed}"
          grep -Fq 'test "${device_count}" = "3"' "${managed}"
          grep -Fq 'select(.version == "26")' "${managed}"
          grep -Fq 'select(.version == "33")' "${managed}"
          grep -Fq 'select(. >= 35 and . <= 36)' "${managed}"
          grep -Fq 'productionAuthorization: false' "${managed}"
          grep -Fq 'participantData: false' "${managed}"
          grep -Fq 'synthetic-public-safe-only' "${managed}"
          ! grep -Fq -- '--results-bucket' "${managed}"
          ! grep -Fq -- '--results-dir' "${managed}"
          ! grep -Fq 'gs://' "${managed}"
          ! grep -Fq 'gcloud storage' "${managed}"
          ! grep -Eq '(set-iam-policy|add-iam-policy-binding|services enable|buckets create|buckets update)' "${managed}"

      - name: Verify permanent preflight remains read-only
        shell: bash
        run: |
          set -euo pipefail
          preflight=scripts/rc5/run-test-lab-isolated-preflight.sh
          grep -Fq 'MODE|isolated_spark_metadata_iam_catalog_only' "${preflight}"
          grep -Fq 'RESOURCE_MUTATION|false' "${preflight}"
          grep -Fq 'MATRIX_EXECUTED|false' "${preflight}"
          grep -Fq 'PARTICIPANT_DATA_ACCESSED|false' "${preflight}"
          grep -Fq 'PRODUCTION_AUTHORIZATION|false' "${preflight}"
          grep -Fq 'RESULT|ready' "${preflight}"
          grep -Fq 'FAILURE_COUNT|0' "${preflight}"
          ! grep -Fq 'firebase test android run' "${preflight}"
          ! grep -Fq 'gcloud storage' "${preflight}"
          ! grep -Eq '(set-iam-policy|add-iam-policy-binding|services enable|buckets create|buckets update)' "${preflight}"

      - name: Verify closure evidence and temporary bridges are absent
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rc5/verify-test-lab-closure.py
          test ! -e .github/workflows/rc5-test-lab-isolated-preflight-once.yml
          test ! -e .github/workflows/rc5-test-lab-isolated-proof-once.yml
          test ! -e .github/workflows/rc5-test-lab-isolated-proof-contract.yml

      - name: Publish contract summary
        shell: bash
        run: |
          {
            echo '### RC5 isolated Test Lab contract'
            echo '- Project: dedicated Firebase Spark project only'
            echo '- Identity: existing GitHub WIF deployer, no key'
            echo '- Authority: roles/editor isolated to the Test Lab project; no owner'
            echo '- APK transport: local files through supported gcloud execution'
            echo '- Results: Firebase-managed default bucket'
            echo '- Matrix: API 26 / 33 / 36, zero flaky retries'
            echo '- Managed closure: run `30183466799/1`'
            echo '- Participant/production authorization: false'
          } >> "${GITHUB_STEP_SUMMARY}"
