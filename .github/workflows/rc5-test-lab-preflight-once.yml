name: DIREKT RC5 one-shot read-only Test Lab preflight bridge

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rc5-test-lab-preflight-once.yml

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: direkt-rc5-test-lab-preflight-once
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch exact-main RC5 read-only preflight and publish receipt
    if: github.repository == 'kudzimusar/direkt'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Dispatch exact-main preflight and publish schema-validated evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          source_sha="${GITHUB_SHA}"
          short_sha="${source_sha:0:12}"
          correlation_id="rc5-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected_run_title="DIREKT RC5 preflight ${correlation_id}"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${correlation_id}" =~ ^rc5-[0-9]+-[1-9][0-9]*$ ]]

          main_sha="$(gh api "repos/${repo}/git/ref/heads/main" --jq '.object.sha')"
          test "${main_sha}" = "${source_sha}"

          payload="$(jq -nc --arg sha "${source_sha}" --arg correlation "${correlation_id}" '{"ref":"main","inputs":{"source_sha":$sha,"correlation_id":$correlation}}')"
          gh api --method POST \
            "repos/${repo}/actions/workflows/rc5-test-lab-preflight.yml/dispatches" \
            --input - <<< "${payload}"

          run_id=""
          for _ in $(seq 1 60); do
            runs_json="$(gh api "repos/${repo}/actions/workflows/rc5-test-lab-preflight.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"
            run_id="$(jq -r --arg sha "${source_sha}" --arg title "${expected_run_title}" '[.workflow_runs[] | select(.head_sha == $sha and .display_title == $title)] | sort_by(.created_at) | last | .id // empty' <<< "${runs_json}")"
            [[ -n "${run_id}" ]] && break
            sleep 5
          done
          if [[ -z "${run_id}" ]]; then
            echo "::error title=RC5 preflight dispatch not observed::No uniquely correlated exact-main preflight run was found."
            exit 1
          fi

          status=""
          conclusion=""
          for _ in $(seq 1 300); do
            run_json="$(gh api "repos/${repo}/actions/runs/${run_id}")"
            test "$(jq -r '.display_title' <<< "${run_json}")" = "${expected_run_title}"
            test "$(jq -r '.head_sha' <<< "${run_json}")" = "${source_sha}"
            status="$(jq -r '.status' <<< "${run_json}")"
            conclusion="$(jq -r '.conclusion // ""' <<< "${run_json}")"
            [[ "${status}" = "completed" ]] && break
            sleep 5
          done

          run_url="https://github.com/${repo}/actions/runs/${run_id}"
          artifact_name="rc5-test-lab-preflight-${run_id}"
          receipt_dir="$(mktemp -d)"
          artifact_downloaded=false
          for _ in $(seq 1 12); do
            if gh run download "${run_id}" --repo "${repo}" --name "${artifact_name}" --dir "${receipt_dir}" >/dev/null 2>&1; then
              artifact_downloaded=true
              break
            fi
            sleep 5
          done

          receipt_file="${receipt_dir}/receipt.txt"
          matrix_file="${receipt_dir}/matrix.json"
          receipt_status="artifact_unavailable"
          findings_body="Sanitized RC5 preflight artifact was not retrievable. No matrix was executed by this bridge."
          matrix_body='{"schema":"direkt.rc5.test-lab-preflight-matrix.v1","selected":false}'

          if [[ "${artifact_downloaded}" = "true" && -f "${receipt_file}" && -f "${matrix_file}" ]]; then
            while IFS= read -r line || [[ -n "${line}" ]]; do
              case "${line}" in
                SOURCE\|*) [[ "${line}" =~ ^SOURCE\|[0-9a-f]{40}$ ]] || exit 1 ;;
                CORRELATION\|*) [[ "${line}" =~ ^CORRELATION\|rc5-[0-9]+-[1-9][0-9]*$ ]] || exit 1 ;;
                MODE\|metadata_iam_catalog_only|RESOURCE_MUTATION\|false|MATRIX_EXECUTED\|false|SECRET_VALUES_ACCESSED\|false|PRODUCTION_AUTHORIZATION\|false|RESULT\|ready|RESULT\|not_ready) ;;
                FAILURE_COUNT\|*) [[ "${line}" =~ ^FAILURE_COUNT\|[0-9]+$ ]] || exit 1 ;;
                PASS\|*|FAIL\|*) [[ "${line}" =~ ^(PASS|FAIL)\|[-A-Za-z0-9[:space:].:@/()+,=_]+$ ]] || exit 1 ;;
                *) echo "::error title=Unexpected RC5 preflight receipt line::Sanitized schema validation failed."; exit 1 ;;
              esac
            done < "${receipt_file}"
            grep -Fxq "SOURCE|${source_sha}" "${receipt_file}"
            grep -Fxq "CORRELATION|${correlation_id}" "${receipt_file}"
            grep -Fxq "RESOURCE_MUTATION|false" "${receipt_file}"
            grep -Fxq "MATRIX_EXECUTED|false" "${receipt_file}"
            grep -Fxq "SECRET_VALUES_ACCESSED|false" "${receipt_file}"
            grep -Fxq "PRODUCTION_AUTHORIZATION|false" "${receipt_file}"

            jq -e '
              type == "object" and
              (.schema == "direkt.rc5.test-lab-preflight-matrix.v1" or .schema == "direkt.rc5.test-lab-matrix.v1") and
              (.selected | type == "boolean") and
              ((.preflightOnly // true) == true) and
              ((.matrixExecuted // false) == false)
            ' "${matrix_file}" >/dev/null
            receipt_status="available_and_schema_validated"
            findings_body="$(cat "${receipt_file}")"
            matrix_body="$(jq -S . "${matrix_file}")"
          fi

          current_main="$(gh api "repos/${repo}/git/ref/heads/main" --jq '.object.sha')"
          receipt_class="${conclusion:-not-completed}"
          if [[ "${status}" = "completed" && "${conclusion}" = "success" && "${current_main}" != "${source_sha}" ]]; then
            receipt_class="stale_success"
          fi

          issue_title="RC5 read-only preflight receipt — ${receipt_class} — ${short_sha} — run ${run_id}"
          issue_body="$(cat <<EOF
          ## RC5 Firebase Test Lab read-only infrastructure preflight

          - Exact inspected source: \`${source_sha}\`
          - Correlation: \`${correlation_id}\`
          - Current main at receipt publication: \`${current_main}\`
          - Managed preflight run: \`${run_id}\`
          - Status: \`${status}\`
          - Conclusion: \`${conclusion:-not-completed}\`
          - Sanitized artifact: \`${artifact_name}\` — \`${receipt_status}\`
          - Boundary: metadata/IAM/bucket/catalog inspection only; no resource mutation; no Test Lab matrix execution; no secret-value access; production authorization false.
          - Run: ${run_url}
          - Tracker: #261

          ### Sanitized findings

          \`\`\`text
          ${findings_body}
          \`\`\`

          ### Sanitized live-catalog matrix candidate

          \`\`\`json
          ${matrix_body}
          \`\`\`
          EOF
          )"
          receipt_url="$(gh api --method POST "repos/${repo}/issues" -f title="${issue_title}" -f body="${issue_body}" --jq '.html_url')"

          tracker_body="$(cat <<EOF
          RC5 read-only Firebase Test Lab infrastructure preflight receipt.

          - Exact inspected source: \`${source_sha}\`
          - Correlation: \`${correlation_id}\`
          - Current main at publication: \`${current_main}\`
          - Managed run: \`${run_id}\`
          - Status/conclusion: \`${status} / ${conclusion:-not-completed}\`
          - Dedicated sanitized receipt: ${receipt_url}
          - Boundary: no resource mutation, no matrix execution, no secret-value access, production authorization false.
          EOF
          )"
          gh api --method POST "repos/${repo}/issues/261/comments" -f body="${tracker_body}" >/dev/null

          if [[ "${artifact_downloaded}" != "true" || ! -f "${receipt_file}" || ! -f "${matrix_file}" ]]; then
            echo "::error title=RC5 preflight artifact unavailable::Run ${run_id} did not expose the expected sanitized artifact."
            exit 1
          fi
          if [[ "${status}" != "completed" || "${conclusion}" != "success" ]]; then
            echo "::error title=RC5 infrastructure preflight not ready::See the dedicated receipt before any managed matrix execution."
            exit 1
          fi
          if [[ "${current_main}" != "${source_sha}" ]]; then
            echo "::error title=RC5 preflight source became stale::The successful result is historical only."
            exit 1
          fi
          grep -Fxq "RESULT|ready" "${receipt_file}"
          grep -Fxq "FAILURE_COUNT|0" "${receipt_file}"
          test "$(jq -r '.selected' "${matrix_file}")" = "true"

          {
            echo "### RC5 read-only Test Lab preflight bridge"
            echo "- Source: \`${source_sha}\`"
            echo "- Correlation: \`${correlation_id}\`"
            echo "- Managed run: \`${run_id}\`"
            echo "- Dedicated receipt: ${receipt_url}"
            echo "- Resource mutation: false"
            echo "- Matrix executed: false"
            echo "- Production authorization: false"
          } >> "${GITHUB_STEP_SUMMARY}"
