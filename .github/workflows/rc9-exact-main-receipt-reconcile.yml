name: RC9 exact-main receipt reconciler

on:
  pull_request:
    paths:
      - ".github/workflows/rc9-exact-main-receipt-reconcile.yml"
      - "scripts/rc9/patch-exact-main-receipt.py"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/rc9-exact-main-receipt'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/rc9-exact-main-receipt
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply and verify exact-main receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rc9/patch-exact-main-receipt.py
          python3 scripts/rc9/verify-generated-foundation.py
          python3 scripts/rc9/verify-generated-client-contract.py
          python3 scripts/rc8/verify-payments-contract.py
          rm scripts/rc9/patch-exact-main-receipt.py
          rm .github/workflows/rc9-exact-main-receipt-reconcile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            WORKSTREAM_LOCK.md \
            docs/integrations/RC9_CLOSURE_RECEIPT.md \
            scripts/rc9/verify-generated-client-contract.py \
            scripts/rc9/patch-exact-main-receipt.py \
            .github/workflows/rc9-exact-main-receipt-reconcile.yml
          git diff --cached --check
          git commit -m 'docs(rc9): bind closure receipt to exact main'
          git push origin HEAD:docs/rc9-exact-main-receipt
