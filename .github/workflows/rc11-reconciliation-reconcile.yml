name: RC11 reconciliation publisher

on:
  pull_request:
    paths:
      - ".github/workflows/rc11-reconciliation-reconcile.yml"
      - "scripts/rc11/patch-reconciliation.py"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/rc11-final-integration-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/rc11-final-integration-closure
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply and verify RC11 reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rc11/patch-reconciliation.py
          python3 scripts/rc8/verify-payments-contract.py
          python3 scripts/rc9/verify-generated-client-contract.py
          python3 scripts/rc10/verify-turnstile-decision.py
          python3 scripts/rc11/verify-final-integration-closure.py
          rm scripts/rc11/patch-reconciliation.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add WORKSTREAM_LOCK.md PROJECT_STATUS.md docs/integrations/CURRENT_INTEGRATION_STATUS.md docs/integrations/LIVE_INTEGRATION_LEDGER.md scripts/rc11/patch-reconciliation.py
          git diff --cached --check
          git commit -m 'docs(rc11): reconcile final integration evidence'
          git push origin HEAD:docs/rc11-final-integration-closure
