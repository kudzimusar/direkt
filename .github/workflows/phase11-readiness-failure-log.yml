name: Phase 11 readiness failure log

on:
  pull_request:
    paths:
      - ".github/workflows/phase11-readiness-failure-log.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'phase11/primary-pilot-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_JOB_ID: "90046827299"
    steps:
      - name: Print readiness failure tail
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/phase11-readiness.log"
          clean="${RUNNER_TEMP}/phase11-readiness-clean.log"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" > "${raw}"
          sed -r 's/\x1B\[[0-9;]*[mK]//g; s/^.*Z //' "${raw}" > "${clean}"
          tail -n 100 "${clean}"
