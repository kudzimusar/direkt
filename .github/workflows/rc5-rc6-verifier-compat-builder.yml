name: DIREKT RC5 RC6 verifier compatibility builder

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rc5-rc6-verifier-compat-builder.yml

permissions:
  contents: write

concurrency:
  group: direkt-rc5-rc6-verifier-compat-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    name: Add post-RC5 closed state to RC6 verifier
    if: github.repository == 'kudzimusar/direkt' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/rc5-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/rc5-closure
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Require branch-only execution
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "docs/rc5-closure"
          test "$(git branch --show-current)" = "docs/rc5-closure"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "c3744430a7beb1cd47246d858df9ac1379a068ac"
      - name: Patch RC6 verifier lifecycle state
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rc5/patch-rc6-closed-lock-state.py
          python3 -m py_compile scripts/rc6/verify-whatsapp-contract.py
          python3 scripts/rc6/verify-whatsapp-contract.py
          python3 scripts/rc6/verify-whatsapp-managed-identity.py
          python3 scripts/rc6/verify-whatsapp-infra-preflight.py
          python3 scripts/rc6/verify-whatsapp-prepare-bridge.py
          python3 scripts/rc6/verify-whatsapp-run-bridge.py
      - name: Remove temporary patch helper and preserve workflow for connector cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/rc5/patch-rc6-closed-lock-state.py
          test -e .github/workflows/rc5-rc6-verifier-compat-builder.yml
      - name: Commit verifier update to branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/rc6/verify-whatsapp-contract.py
          git add -u scripts/rc5/patch-rc6-closed-lock-state.py
          git diff --cached --check
          git commit -m "test(rc6): support closed RC5 and released lane [skip ci]"
          git push origin HEAD:docs/rc5-closure
