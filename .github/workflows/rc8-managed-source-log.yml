name: RC8 managed source validation log

on:
  pull_request:
    paths:
      - ".github/workflows/rc8-managed-source-log.yml"

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/rc8-managed-sandbox-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_JOB_ID: "89889696809"
    steps:
      - name: Print bounded managed-source failure
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/rc8-managed-source.log"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" > "${raw}"
          tail -n 50 "${raw}"
