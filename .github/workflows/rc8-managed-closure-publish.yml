name: RC8 managed closure publisher

on:
  pull_request:
    paths:
      - ".github/workflows/rc8-managed-closure-publish.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/rc8-managed-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/rc8-managed-closure
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reconcile and publish non-workflow closure files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/rc8/patch-rc8-managed-closure.py')
          text = path.read_text(encoding='utf-8')
          start = text.find('# Keep the managed exact-source step fail-closed:')
          end = text.find('# Permanent verifier: enforce closure, consumed trigger, immutable receipt, and no automatic execution.')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('closure patch guard markers not found')
          replacement = '''# Keep the manual managed path fail-closed.
          workflow_text = (ROOT / workflow).read_text(encoding="utf-8")
          if workflow_text.count("grep -Fxq 'STATUS=CONSUMED' docs/integrations/RC8_PAYMENTS_MANAGED_TRIGGER.md") != 1:
              raise AssertionError(f"{workflow}: expected one consumed PR-contract check")
          if workflow_text.count("grep -Fxq 'STATUS=ARMED' docs/integrations/RC8_PAYMENTS_MANAGED_TRIGGER.md") != 1:
              raise AssertionError(f"{workflow}: expected one manual rearm check")

          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              'replace_once(trigger, "STATUS=ARMED", "STATUS=CONSUMED")',
              'replace_once(trigger, "STATUS=ARMED\\n", "STATUS=CONSUMED\\n")',
              1,
          )
          old = '''replace_once(workflow, "grep -Fxq 'STATUS=ARMED' docs/integrations/RC8_PAYMENTS_MANAGED_TRIGGER.md", "grep -Fxq 'STATUS=CONSUMED' docs/integrations/RC8_PAYMENTS_MANAGED_TRIGGER.md")'''
          new = '''workflow_path = ROOT / workflow
          workflow_text = workflow_path.read_text(encoding="utf-8")
          armed_check = "grep -Fxq 'STATUS=ARMED' docs/integrations/RC8_PAYMENTS_MANAGED_TRIGGER.md"
          if workflow_text.count(armed_check) != 2:
              raise AssertionError(f"{workflow}: expected two armed checks before closure")
          workflow_path.write_text(workflow_text.replace(armed_check, "grep -Fxq 'STATUS=CONSUMED' docs/integrations/RC8_PAYMENTS_MANAGED_TRIGGER.md", 1), encoding="utf-8")'''
          if old not in text:
              raise SystemExit('workflow trigger patch not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/rc8/patch-rc8-managed-closure.py
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: handoff marker mismatch')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'scripts/rc5/verify-test-lab-closure.py',
              '''assert released_handoff or rc7_handoff or rc7_closed_handoff or rc8_active_handoff, (
              "RC5 closure must remain valid with no active lane, bounded RC7 active, RC7 closed/released, or bounded RC8 active"
          )''',
              '''rc8_closed_handoff = (
              "| Status | RELEASED |" in lock
              and "RC8 implementation contract — CLOSED AND PRESERVED" in lock
              and "No repository write lane is active" in lock
          )
          assert released_handoff or rc7_handoff or rc7_closed_handoff or rc8_active_handoff or rc8_closed_handoff, (
              "RC5 closure must remain valid through RC8 closed/released"
          )''',
          )
          rc6 = 'scripts/rc6/verify-whatsapp-contract.py'
          replace_once(
              rc6,
              '''    supported_states = (
                  all(needle in lock for needle in active_lock_needles),''',
              '''    rc8_closed_lock_needles = (
                  "| Status | RELEASED |",
                  "RC5 implementation contract — CLOSED AND PRESERVED",
                  "RC6 implementation contract — CLOSED AND PRESERVED",
                  "exact-current-main managed run `30137700769`",
                  "RC7 implementation contract — CLOSED AND PRESERVED",
                  "RC8 implementation contract — CLOSED AND PRESERVED",
                  "No repository write lane is active",
                  "production/participant WhatsApp delivery remains disabled",
              )
              supported_states = (
                  all(needle in lock for needle in active_lock_needles),''',
          )
          replace_once(
              rc6,
              '''        all(needle in lock for needle in rc8_active_lock_needles),
              )''',
              '''        all(needle in lock for needle in rc8_active_lock_needles),
                  all(needle in lock for needle in rc8_closed_lock_needles),
              )''',
          )
          replace_once(
              rc6,
              '"RC6 lock must be exactly one supported state: active RC6, RC5 resumed, no active lane before RC7, bounded RC7 active, RC7 closed/released, or bounded RC8 active."',
              '"RC6 lock must be exactly one supported state through RC8 closed/released."',
          )
          replace_once(
              'scripts/rc7/verify-maps-contract.py',
              '''    if not (rc7_released or rc8_active):
                  raise AssertionError("RC7 closure must remain preserved with the lane released or bounded RC8 active.")''',
              '''    rc8_closed = (
                  "| Status | RELEASED |" in lock
                  and "RC8 implementation contract — CLOSED AND PRESERVED" in lock
                  and "No repository write lane is active" in lock
              )
              if not (rc7_released or rc8_active or rc8_closed):
                  raise AssertionError("RC7 closure must remain preserved through RC8 closed/released.")''',
          )
          print('RC5_RC6_RC7_RC8_CLOSED_HANDOFFS|PASS')
          PY
          python3 scripts/rc8/verify-payments-contract.py
          python3 scripts/rc5/verify-test-lab-closure.py
          python3 scripts/rc6/verify-whatsapp-contract.py
          python3 scripts/rc7/verify-maps-contract.py
          python3 -m py_compile scripts/rc5/verify-test-lab-closure.py scripts/rc6/verify-whatsapp-contract.py scripts/rc7/verify-maps-contract.py scripts/rc8/verify-payments-contract.py
          git restore .github/workflows/rc8-payments-managed.yml scripts/rc8/patch-rc8-managed-closure.py
          sed -i 's/[[:space:]]\+$//' WORKSTREAM_LOCK.md PROJECT_STATUS.md docs/integrations/CURRENT_INTEGRATION_STATUS.md docs/integrations/LIVE_INTEGRATION_LEDGER.md docs/integrations/RC8_SANDBOX_PAYMENTS_IMPLEMENTATION.md docs/integrations/RC8_PAYMENTS_MANAGED_TRIGGER.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add WORKSTREAM_LOCK.md PROJECT_STATUS.md docs/integrations/CURRENT_INTEGRATION_STATUS.md docs/integrations/LIVE_INTEGRATION_LEDGER.md docs/integrations/RC8_SANDBOX_PAYMENTS_IMPLEMENTATION.md docs/integrations/RC8_PAYMENTS_MANAGED_TRIGGER.md scripts/rc5/verify-test-lab-closure.py scripts/rc6/verify-whatsapp-contract.py scripts/rc7/verify-maps-contract.py scripts/rc8/verify-payments-contract.py
          git diff --cached --check
          git commit -m 'docs(rc8): close managed sandbox payment checkpoint'
          git push origin HEAD:docs/rc8-managed-closure
